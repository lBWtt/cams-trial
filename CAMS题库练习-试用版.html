  </div>
  <div class="console-body">

  </div>

    </div>
  </div>
</div>

function readJson(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); }
  catch { return fallback; }
}
function writeJson(key, value) { localStorage.setItem(key, JSON.stringify(value)); }
function getStats() { return readJson('camsB_stats', {}); }
function getDismissedWrongIds() { return readJson('camsB_wrong_dismissed', []); }
function getWrongIds() {
  const stats = getStats();
  const dismissed = new Set(getDismissedWrongIds());
  return ALL_QUESTIONS
    .filter(q => (stats[q.id]?.wrong || 0) > 0 && stats[q.id]?.status !== 'mastered')
    .map(q => q.id)
    .filter(id => !dismissed.has(id));
}
function saveStats(stats) { writeJson('camsB_stats', stats); }
function getTimeSettings() { return { ...DEFAULT_TIME_SETTINGS, ...readJson('camsB_time_settings', {}) }; }
function saveTimeSettings(settings) { writeJson('camsB_time_settings', { ...getTimeSettings(), ...settings }); }
function questionById(id) { return ALL_QUESTIONS.find(q => q.id === id); }
function cleanText(s) { return String(s || '').replace(/^[A-Z]\./, '').trim(); }
function isMulti(q) { return q.type.includes('多') || (q.answer || '').length > 1; }
function progressKey(kind) { return 'camsB_progress_' + String(kind).replace(/[^a-zA-Z0-9:_-]/g, '_'); }
function progressBackupKey(kind) { return progressKey(kind) + '_backup'; }
function progressArchiveKey(kind) { return progressKey(kind) + '_archive'; }
function progressAnswerCount(progress) {
  return Math.max(Number(progress?.answeredCount || 0), Object.keys(progress?.sessionAnswers || {}).length);
}
function progressSavedAt(progress) { return Number(progress?.savedAt || 0); }
function isUsableProgress(progress) {
  return progress && progressAnswerCount(progress) > 0 && !progress.sessionFinalized;
}
function normalizeSavedProgress(progress, list=practiceList) {
  if (!isUsableProgress(progress)) return null;
  const idToIndex = new Map(list.map((q, index) => [q.id, index]));
  const savedIds = Array.isArray(progress.practiceIds) ? progress.practiceIds : String(progress.listSignature || '').split('|').filter(Boolean);
  const savedCurrentId = progress.currentQid || savedIds[progress.index] || progress.sessionAnswers?.[progress.index]?.qid;
  const sessionAnswers = {};
  Object.values(progress.sessionAnswers || {}).forEach(record => {
    const nextIndex = idToIndex.get(record.qid);
    if (nextIndex === undefined) return;
    sessionAnswers[nextIndex] = { ...record, index: nextIndex };
  });
  const fallbackIndex = Math.min(Math.max(Number(progress.index || 0), 0), Math.max(list.length - 1, 0));
  const index = idToIndex.has(savedCurrentId) ? idToIndex.get(savedCurrentId) : fallbackIndex;
  const answeredCount = Object.keys(sessionAnswers).length || Number(progress.answeredCount || 0);
  const correctCount = Object.values(sessionAnswers).filter(record => record.ok).length || Number(progress.correctCount || 0);
  return { ...progress, index, total: list.length, answeredCount, correctCount, sessionAnswers };
}
function getSavedProgress(kind) {
  const candidates = [readJson(progressKey(kind), null), readJson(progressBackupKey(kind), null)]
    .map(progress => normalizeSavedProgress(progress))
    .filter(Boolean)
    .sort((a, b) => progressAnswerCount(b) - progressAnswerCount(a) || progressSavedAt(b) - progressSavedAt(a));
  return candidates[0] || null;
}
function backupPracticeProgress(kind) {
  const current = readJson(progressKey(kind), null);
  if (isUsableProgress(current)) writeJson(progressBackupKey(kind), current);
}
function hasSavedProgress(kind) {
  return [readJson(progressKey(kind), null), readJson(progressBackupKey(kind), null)].some(isUsableProgress);
}
function archivePracticeProgress(kind) {
  const items = [readJson(progressKey(kind), null), readJson(progressBackupKey(kind), null)]
    .filter(isUsableProgress)
    .sort((a, b) => progressAnswerCount(b) - progressAnswerCount(a) || progressSavedAt(b) - progressSavedAt(a));
  if (items[0]) writeJson(progressArchiveKey(kind), { ...items[0], archivedAt: Date.now() });
  localStorage.removeItem(progressKey(kind));
  localStorage.removeItem(progressBackupKey(kind));
}
function savePracticeProgress() {
  if (sessionFinalized || !currentPractice || !practiceList.length || String(currentPractice).startsWith('single:') || currentPractice === 'exam') return;
  const key = progressKey(currentPractice);
  const previous = readJson(key, null);
  if (isUsableProgress(previous) && progressAnswerCount(previous) > progressAnswerCount({ answeredCount, sessionAnswers })) {
    writeJson(progressBackupKey(currentPractice), previous);
  }
  writeJson(key, {
    index: currentIndex,
    currentQid: practiceList[currentIndex]?.id,
    total: practiceList.length,
    practiceIds: practiceList.map(q => q.id),
    listSignature: currentListSignature(),
    correctCount,
    answeredCount,
    sessionAnswers,
    sessionFinalized,
    mode,
    savedAt: Date.now()

}

  if (row.status === 'mastered') return false;
  return row.status === 'unmastered' || row.status === 'fuzzy' || (row.forgot || 0) > 0 || (row.slow || 0) > 0 || (row.hesitant || 0) > 0;

function getTimeStage(q, elapsedSec) {
  const s = getTimeSettings();
  if (!s.enabled) return { max: Infinity, key: 'off', label: '未检测' };
  const stages = isMulti(q) ? [
    { max: Number(s.multiFast), key: 'fast', label: '熟练' },
    { max: Number(s.multiHesitant), key: 'hesitant', label: '有点犹豫' },
    { max: Number(s.multiSlow), key: 'slow', label: '慢答' },
    { max: Infinity, key: 'timeout', label: '疑似离开' }
  ] : [
    { max: Number(s.singleFast), key: 'fast', label: '熟练' },
    { max: Number(s.singleHesitant), key: 'hesitant', label: '有点犹豫' },
    { max: Number(s.singleSlow), key: 'slow', label: '慢答' },
    { max: Infinity, key: 'timeout', label: '疑似离开' }
  ];
  return stages.find(stage => elapsedSec <= stage.max) || stages[stages.length - 1];
}

function touchStat(qid, isCorrectAnswer, elapsedSec, timeStage, meta={}) {
  const stats = getStats();
  const settings = getTimeSettings();
  const now = Date.now();
  const forceForgot = !!meta.forceForgot;

  row.lastStage = timeStage.key;

    const cappedElapsed = Math.min(elapsedSec || 0, Number(settings.cap) || DEFAULT_TIME_SETTINGS.cap);
    row.answerTimeTotal = (row.answerTimeTotal || 0) + cappedElapsed;
    row.answerTimeCount = (row.answerTimeCount || 0) + 1;
    row.lastElapsedSec = elapsedSec || 0;
    row.timeStages = row.timeStages || {};
    row.timeStages[timeStage.key] = (row.timeStages[timeStage.key] || 0) + 1;
    if (timeStage.key === 'hesitant') row.hesitant = (row.hesitant || 0) + 1;
    if (timeStage.key === 'slow' || timeStage.key === 'timeout') row.slow = (row.slow || 0) + 1;
  }

    row.lastCorrectAt = now;
    row.lastResult = 'correct';
    row.correctStreak = (row.correctStreak || 0) + 1;
    if (isFastStage(timeStage)) row.fastCorrectStreak = (row.fastCorrectStreak || 0) + 1;
    else {
      row.fastCorrectStreak = 0;
      if (row.status !== 'unmastered') row.status = 'fuzzy';
    }
    if ((row.fastCorrectStreak || 0) >= REVIEW_FAST_STREAK_TO_MASTER) {
      row.status = 'mastered';
      row.masteredAt = now;
    }
  } else if (forceForgot) {
    row.forgot = (row.forgot || 0) + 1;
    row.lastForgotAt = now;
    row.lastResult = 'forgot';
    row.correctStreak = 0;
    row.fastCorrectStreak = 0;
    row.status = 'unmastered';
  } else {
    row.wrong = (row.wrong || 0) + 1;
    row.lastWrongAt = now;
    row.lastResult = 'wrong';
    row.correctStreak = 0;
    row.fastCorrectStreak = 0;
    row.status = 'unmastered';
  }
  stats[qid] = row;
  saveStats(stats);
  if (row.status === 'mastered') removeWrong(qid);
  return row;
}

function addWrong(qid) {
  writeJson('camsB_wrong_dismissed', getDismissedWrongIds().filter(x => x !== qid));
  const ids = readJson('camsB_wrong', []);
  if (!ids.includes(qid)) writeJson('camsB_wrong', [...ids, qid]);
}
function removeWrong(qid) {
  writeJson('camsB_wrong', readJson('camsB_wrong', []).filter(x => x !== qid));
  const dismissed = getDismissedWrongIds();
  if (!dismissed.includes(qid)) writeJson('camsB_wrong_dismissed', [...dismissed, qid]);
}
function setMastery(qid, status) {
  const stats = getStats();
  const now = Date.now();
  const row = { ...(stats[qid] || {}), status, lastManualStatusAt: now };
  if (status === 'mastered') {
    row.correctStreak = Math.max(row.correctStreak || 0, REVIEW_FAST_STREAK_TO_MASTER);
    row.fastCorrectStreak = Math.max(row.fastCorrectStreak || 0, REVIEW_FAST_STREAK_TO_MASTER);
    row.masteredAt = now;
  } else {
    row.fastCorrectStreak = 0;
    if (status === 'unmastered') row.correctStreak = 0;
  }
  stats[qid] = row;
  saveStats(stats);
  if (status === 'mastered') removeWrong(qid);
  renderWrongBook();
  initHome();
}
function markForgot(qid, refresh=true) {
  const pending = sessionAnswers[currentIndex];
  if (!sessionFinalized && pending && pending.qid === qid && !pending.committed) {
    if (pending.ok) correctCount = Math.max(0, correctCount - 1);
    pending.ok = false;
    pending.forceForgot = true;
    pending.manualForgot = true;
    savePracticeProgress();
    document.getElementById('scoreBadge').textContent = `正确：${correctCount}`;
    const notice = document.getElementById('masteryNotice');
    if (notice) notice.textContent = '已在本轮标记为“记不住了”，提交后会进入不熟悉复习。';
    return;
  }
  const stats = getStats();
  const row = stats[qid] || { wrong: 0, correct: 0 };
  row.forgot = (row.forgot || 0) + 1;
  row.status = 'unmastered';
  row.correctStreak = 0;
  row.fastCorrectStreak = 0;
  row.lastResult = 'forgot';
  row.lastForgotAt = Date.now();
  stats[qid] = row;
  saveStats(stats);
  document.getElementById('wrongBadge').textContent = `错题：${getWrongIds().length}`;
  const notice = document.getElementById('masteryNotice');
  if (notice) notice.textContent = '已标记为“记不住了”，会进入不熟悉复习。';
  if (refresh) initHome();
}
function clearWrongBook() {
  if (confirm('确定清空所有错题？错题次数统计会保留。')) {
    const dismissed = new Set([...getDismissedWrongIds(), ...getWrongIds()]);
    writeJson('camsB_wrong_dismissed', [...dismissed]);
    writeJson('camsB_wrong', []);
    renderWrongBook();
    initHome();
  }
}

function getWrongQuestions() {
  const ids = getWrongIds();
  return ALL_QUESTIONS.filter(q => ids.includes(q.id));
}
function getChapterStats() {
  const stats = getStats();
  const wrongIds = getWrongIds();
  return CHAPTERS.map(ch => {
    const qs = ALL_QUESTIONS.filter(q => q.chapter_id === ch.id);
    const wrongQs = qs.filter(q => wrongIds.includes(q.id));
    const attempts = qs.reduce((sum, q) => sum + ((stats[q.id]?.wrong || 0) + (stats[q.id]?.correct || 0)), 0);
    const wrongAttempts = qs.reduce((sum, q) => sum + (stats[q.id]?.wrong || 0), 0);
    return { ...ch, total: qs.length, single: qs.filter(q => !isMulti(q)).length, multi: qs.filter(q => isMulti(q)).length, wrongCount: wrongQs.length, attempts, wrongAttempts, weakRate: attempts ? wrongAttempts / attempts : 0 };
  });
}
function getSortedWrong(kind) {
  const stats = getStats();
  let rows = getWrongQuestions();
  if (kind === 'wrong1') rows = rows.filter(q => (stats[q.id]?.wrong || 0) === 1);
  if (kind === 'wrong2') rows = rows.filter(q => (stats[q.id]?.wrong || 0) === 2);
  if (kind === 'wrong3') rows = rows.filter(q => (stats[q.id]?.wrong || 0) >= 3);
  if (kind === 'hard') rows = rows.filter(q => (stats[q.id]?.wrong || 0) >= 2);
  if (kind === 'recent') rows = rows.sort((a,b) => (stats[b.id]?.lastWrongAt || 0) - (stats[a.id]?.lastWrongAt || 0));
  else rows = rows.sort((a,b) => wrongReviewScore(b, stats[b.id] || {}) - wrongReviewScore(a, stats[a.id] || {}));
  return rows;
}

function getFamiliarityQuestions(kind='all') {
  const stats = getStats();
  return ALL_QUESTIONS
    .filter(q => {
      const row = stats[q.id] || {};
      if (row.status === 'mastered') return false;
      if (kind === 'slow') return (row.slow || 0) > 0;
      if (kind === 'hesitant') return (row.hesitant || 0) > 0;
      if (kind === 'forgot') return (row.forgot || 0) > 0;
      if (kind === 'manual') return row.status === 'unmastered' || row.status === 'fuzzy';
      return isFamiliarityUnresolved(row);
    })
    .sort((a, b) => familiarityScore(b, stats[b.id] || {}) - familiarityScore(a, stats[a.id] || {}));
}

function getReviewCounts() {
  return {
    wrongAll: getSortedWrong('all').length,
    wrong1: getSortedWrong('wrong1').length,
    wrong2: getSortedWrong('wrong2').length,
    wrong3: getSortedWrong('wrong3').length,
    hard: getSortedWrong('hard').length,
    recent: getSortedWrong('recent').length,
    famAll: getFamiliarityQuestions('all').length,
    famSlow: getFamiliarityQuestions('slow').length,
    famHesitant: getFamiliarityQuestions('hesitant').length,
    famForgot: getFamiliarityQuestions('forgot').length,
    famManual: getFamiliarityQuestions('manual').length
  };
}

function familiarityScore(q, row) {
  const ageDays = row.lastAnsweredAt ? Math.floor((Date.now() - row.lastAnsweredAt) / 86400000) : 999;
  let score = 0;
  if (row.status === 'unmastered') score += 100;
  if (row.status === 'fuzzy') score += 70;
  score += (row.forgot || 0) * 30;
  score += (row.wrong || 0) * 25;
  score += (row.slow || 0) * 15;
  score += (row.hesitant || 0) * 8;
  score -= (row.fastCorrectStreak || 0) * 20;
  score -= (row.correctStreak || 0) * 8;
  score += Math.max(0, 20 - ageDays);
  if (isMulti(q)) score += 3;
  return score;
}

function wrongReviewScore(q, row) {
  const ageDays = row.lastWrongAt ? Math.floor((Date.now() - row.lastWrongAt) / 86400000) : 999;
  let score = 0;
  if (row.status === 'unmastered') score += 90;
  if (row.status === 'fuzzy') score += 45;
  score += (row.wrong || 0) * 30;
  score += Math.max(0, 25 - ageDays);
  score -= (row.fastCorrectStreak || 0) * 24;
  score -= (row.correctStreak || 0) * 10;
  if (isMulti(q)) score += 4;
  return score;
}

function initTimeConsole() {
  const box = document.getElementById('timeConsole');
  const handle = document.getElementById('timeConsoleHandle');
  const saved = readJson('camsB_time_console_pos', null);
  if (saved && Number.isFinite(saved.left) && Number.isFinite(saved.top)) {
    box.style.left = Math.max(8, Math.min(saved.left, window.innerWidth - 80)) + 'px';
    box.style.top = Math.max(8, Math.min(saved.top, window.innerHeight - 48)) + 'px';
    box.style.right = 'auto';
    box.style.bottom = 'auto';
  }
  if (readJson('camsB_time_console_collapsed', false)) box.classList.add('collapsed');
  let drag = null;
  handle.addEventListener('pointerdown', event => {
    if (event.target.closest('button')) return;
    const rect = box.getBoundingClientRect();
    drag = { dx: event.clientX - rect.left, dy: event.clientY - rect.top };
    handle.setPointerCapture(event.pointerId);
  });
  handle.addEventListener('pointermove', event => {
    if (!drag) return;
    const width = box.offsetWidth;
    const height = box.offsetHeight;
    const left = Math.max(8, Math.min(event.clientX - drag.dx, window.innerWidth - width - 8));
    const top = Math.max(8, Math.min(event.clientY - drag.dy, window.innerHeight - height - 8));
    box.style.left = left + 'px';
    box.style.top = top + 'px';
    box.style.right = 'auto';
    box.style.bottom = 'auto';
  });
  handle.addEventListener('pointerup', () => {
    if (!drag) return;
    drag = null;
    const rect = box.getBoundingClientRect();
    writeJson('camsB_time_console_pos', { left: Math.round(rect.left), top: Math.round(rect.top) });
  });
}

function resetTimeConsole(event) {

const FZ_BASE = { stem: 21, option: 19, answer: 16, explain: 17, ui: 14, homeTitle: 28, section: 16, stat: 24 };
function setFontScale(stem) {
  stem = Math.min(30, Math.max(14, Number(stem) || 21));
  const r = stem / FZ_BASE.stem;
  const px = (v) => Math.round(v * r) + 'px';
  const vars = {
    '--stem-size': px(FZ_BASE.stem), '--option-size': px(FZ_BASE.option),
    '--answer-size': px(FZ_BASE.answer), '--explain-size': px(FZ_BASE.explain),
    '--ui-size': px(FZ_BASE.ui), '--home-title-size': px(FZ_BASE.homeTitle),
    '--section-size': px(FZ_BASE.section), '--stat-size': px(FZ_BASE.stat)
  };
  Object.keys(vars).forEach(k => document.body.style.setProperty(k, vars[k]));
  localStorage.setItem('camsB_font_scale', String(stem));
  const sl = document.getElementById('fontSlider');
  if (sl) sl.value = stem;
  const lb = document.getElementById('fontScaleVal');
  if (lb) lb.textContent = stem + 'px';
}

function startPractice(kind) {
  stopExamTimer();
  currentPractice = kind;
  if (kind === 'wrong') practiceList = getSortedWrong('all');
  else if (String(kind).startsWith('wrong:')) {
    const filter = String(kind).split(':')[1] || 'all';
    practiceList = getSortedWrong(filter === '3' ? 'wrong3' : filter === '2' ? 'wrong2' : filter === '1' ? 'wrong1' : 'all');
  }
  else if (kind === 'hard') practiceList = getSortedWrong('hard');
  else if (kind === 'recent') practiceList = getSortedWrong('recent').slice(0, 60);
  else if (kind === 'familiarity') practiceList = getFamiliarityQuestions('all');
  else if (String(kind).startsWith('fam:')) {
    const filter = String(kind).split(':')[1] || 'all';
    practiceList = getFamiliarityQuestions(filter);
  }
  else if (kind === 'multi') practiceList = ALL_QUESTIONS.filter(isMulti);
  else if (kind === 'exam') {
    practiceList = [...ALL_QUESTIONS].sort(() => Math.random() - .5).slice(0, Math.min(120, ALL_QUESTIONS.length));
    startExamTimer();
  }
  else if (String(kind).startsWith('chapterWrong:')) {
    const chId = Number(String(kind).split(':')[1]);
    const wrongIds = getWrongIds();
    practiceList = ALL_QUESTIONS.filter(q => q.chapter_id === chId && wrongIds.includes(q.id));
  }
  else if (kind === 'all') practiceList = [...ALL_QUESTIONS];
  else practiceList = ALL_QUESTIONS.filter(q => q.chapter_id === kind);
  if (mode === 'random' && kind !== 'exam') practiceList = [...practiceList].sort(() => Math.random() - .5);
  if (!practiceList.length) {
    alert('这一组暂时没有题目。');
    goHome();
    return;
  }
  let saved = getSavedProgress(kind);
  if (saved?.practiceIds?.length) {
    const byId = new Map(practiceList.map(q => [q.id, q]));
    const restored = saved.practiceIds.map(id => byId.get(id)).filter(Boolean);
    const restoredIds = new Set(restored.map(q => q.id));
    const appended = practiceList.filter(q => !restoredIds.has(q.id));
    if (restored.length) {
      practiceList = [...restored, ...appended];
      saved = normalizeSavedProgress(saved, practiceList);
    }
  }
  const canResume = !!saved && saved.index >= 0 && saved.index < practiceList.length;
  if (canResume && confirm(`上次练到第 ${saved.index + 1} / ${saved.total} 题（${fmtSavedTime(saved.savedAt)}）。\n\n点“确定”继续上次进度，点“取消”重新开始。`)) {
    currentIndex = saved.index;
    correctCount = saved.correctCount || 0;
    answeredCount = saved.answeredCount || 0;
    sessionAnswers = saved.sessionAnswers || {};
    sessionFinalized = !!saved.sessionFinalized;
  } else {
    if (saved) archivePracticeProgress(kind);
    currentIndex = 0;
    correctCount = 0;
    answeredCount = 0;
    sessionAnswers = {};
    sessionFinalized = false;
  }
  show('practice');
  closeQuestionNavigator();
  renderQuestion();
}

function restartPractice() {
  document.getElementById('finishOverlay').classList.remove('show');
  startPractice(currentPractice);
}

function vJTotals() {
  let c = 0, t = 0;
  try {
    const stats = getStats();
    Object.values(stats).forEach(r => { c += (r.correct || 0); t += (r.correct || 0) + (r.wrong || 0); });
  } catch (e) {}
  try {
    if (!sessionFinalized) Object.values(sessionAnswers || {}).forEach(r => { if (r && r.committed !== true) { if (r.ok) c++; t++; } });
  } catch (e) {}
  return { c, t };
}
function vJStreak() {
  const sa = sessionAnswers || {};
  let i = currentIndex;
  if (!sa[i]) i--;
  let n = 0;
  for (; i >= 0; i--) { const r = sa[i]; if (!r || !r.ok) break; n++; }
  return n;
}
function vJEnsureSide() {
  const qc = document.querySelector('#practice .q-container');
  if (!qc) return null;
  let s = document.getElementById('statSide');
  if (!s) {
    s = document.createElement('div');
    s.id = 'statSide';
    s.innerHTML = '<div class="side-h">答题状态</div>'
      + '<div class="stat-big" id="vJAccBig">--</div><div class="stat-cap">全盘正确率</div>'
      + '<div class="stat-row">连击 <strong id="vJStreakBig">0</strong></div>'
      + '<div class="stat-row">本轮 <strong id="vJSess">0/0</strong></div>';
    qc.appendChild(s);
  }
  return s;
}
function vJRefresh(pulse) {
  const acc = document.getElementById('accBadge');
  const stk = document.getElementById('streakBadge');
  if (!acc && !stk) return;
  const tt = vJTotals();
  const pct = tt.t > 0 ? Math.round(tt.c / tt.t * 100) : null;
  const n = vJStreak();
  if (acc) {
    acc.textContent = pct === null ? '正确率：--' : `正确率：${pct}%`;
    acc.classList.toggle('acc-good', pct !== null && pct >= 85);
    acc.classList.toggle('acc-mid', pct !== null && pct >= 60 && pct < 85);
    acc.classList.toggle('acc-bad', pct !== null && pct < 60);
    if (pulse) { acc.classList.remove('vJpulse'); void acc.offsetWidth; acc.classList.add('vJpulse'); }
  }
  if (stk) {
    stk.textContent = `🔥${n}`;
    stk.classList.toggle('hot', n >= 3);
  }
  vJEnsureSide();
  const big = document.getElementById('vJAccBig');
  if (big) {
    big.textContent = pct === null ? '--' : pct + '%';
    big.classList.toggle('acc-good', pct !== null && pct >= 85);
    big.classList.toggle('acc-mid', pct !== null && pct >= 60 && pct < 85);
    big.classList.toggle('acc-bad', pct !== null && pct < 60);
  }
  const sb = document.getElementById('vJStreakBig');
  if (sb) sb.textContent = n;
  const ss = document.getElementById('vJSess');
  if (ss) { try { ss.textContent = correctCount + '/' + answeredCount; } catch (e) {} }
}
function renderQuestion() {
  if (currentIndex >= practiceList.length) { showFinish(); return; }
  savePracticeProgress();

      <button class="forget-btn" onclick="giveUpQuestion()">我忘了，看答案</button>

function selectOpt(idx) {
  if (answered) return;
  const q = practiceList[currentIndex];
  if (!isMulti(q)) {
    selectedOptions = [idx];
    judgeAnswer();
    return;
  } else {
    const el = document.getElementById('opt_' + idx);
    if (selectedOptions.includes(idx)) {
      selectedOptions = selectedOptions.filter(x => x !== idx);
      el.classList.remove('selected');
    } else {
      selectedOptions.push(idx);
      el.classList.add('selected');
    }
  }
  const confirmBtn = document.getElementById('confirmBtn');
  if (confirmBtn) confirmBtn.disabled = selectedOptions.length === 0;
}

function submitMulti() {
  if (selectedOptions.length) judgeAnswer();
}

function giveUpQuestion() {
  if (answered) return;
  selectedOptions = [];
  judgeAnswer(true);
}

function shouldStayInCurrentReview(q, row) {
  if (!isReviewPracticeKind()) return false;
  if (row.status === 'mastered') return false;
  if (isWrongReviewKind()) return (row.wrong || 0) > 0;
  if (isFamReviewKind()) return isFamiliarityUnresolved(row);
  return false;
}

function refreshReviewQueueAfterAnswer(record, row) {
  if (!isReviewPracticeKind()) return;
  const q = practiceList[record.index];
  if (!q || !shouldStayInCurrentReview(q, row)) return;
  record.reviewStillUnmastered = true;
}

function renderAnswerResult(record) {
  const q = practiceList[record.index];
  const correctLetters = String(q.answer || '').split('');
  q.options.forEach((_, i) => {
    const letter = String.fromCharCode(65 + i);
    const el = document.getElementById('opt_' + i);
    if (!el) return;
    el.classList.add('disabled');
    if (correctLetters.includes(letter)) el.classList.add(record.selectedOptions.includes(i) ? 'correct' : 'missed');
    else if (record.selectedOptions.includes(i)) el.classList.add('wrong');
    el.classList.remove('selected');
  });
  const confirmBtn = document.getElementById('confirmBtn');
  if (confirmBtn) confirmBtn.disabled = true;
  const forgetBtn = document.querySelector('.forget-btn');
  if (forgetBtn) forgetBtn.disabled = true;
  const stats = getStats()[q.id] || {};
  const expl = q.explanation ? `<div class="explanation"><div class="expl-title">题目解析</div>${q.explanation}</div>` : '';
  const avgTime = stats.answerTimeCount ? Math.round((stats.answerTimeTotal || 0) / stats.answerTimeCount) : 0;
  const settings = getTimeSettings();
  const timeNote = record.elapsedSec > settings.cap ? `本题用时 ${record.elapsedSec} 秒，熟悉度统计按 ${settings.cap} 秒封顶。` : `本题用时 ${record.elapsedSec} 秒。`;
  const stageNote = record.timeStage.key === 'fast' ? '熟练作答。' :
    record.timeStage.key === 'hesitant' ? '有点犹豫，建议后面再见一次。' :
    record.timeStage.key === 'slow' ? '慢答，会进入复习池。' :
    record.timeStage.key === 'timeout' ? '时间过长，可能离开页面；会进入复习池，但统计已封顶。' :
    '时间检测已关闭。';
  const timeSummaryHtml = settings.enabled
    ? `<div class="answer-text"><strong>本题累计：</strong>错 ${stats.wrong || 0} 次， 对 ${stats.correct || 0} 次，犹豫 ${stats.hesitant || 0} 次，慢答 ${stats.slow || 0} 次，平均 ${avgTime} 秒</div><div class="answer-text"><strong>熟悉度：</strong>${record.timeStage.label}。${timeNote} ${stageNote}</div>`
    : `<div class="answer-text"><strong>本题累计：</strong>错 ${stats.wrong || 0} 次， 对 ${stats.correct || 0} 次。时间检测已关闭。</div>`;
  document.getElementById('resultBox').innerHTML = `
    <div class="result-box">
      <div class="result-label ${record.ok ? 'correct' : 'wrong'}">${record.ok ? '回答正确' : (record.forceForgot ? '已标记为记不住' : '回答错误')}</div>
      <div class="answer-text"><strong>我的选择：</strong>${record.selectedLetters || '未选择'}　<strong>正确答案：</strong>${q.answer}</div>
      ${timeSummaryHtml}
      ${expl}
      <div class="tap-next-hint" id="masteryNotice">答完后点击题卡空白处，可直接进入下一题。连续快速答对 2 次会自动标记为已掌握；你也可以手动标记。</div>
      <div class="mastery-row">
        <button class="small-btn" onclick="markForgot('${q.id}')">记不住了</button>
        <button class="small-btn" onclick="setMastery('${q.id}','unmastered')">标记未掌握</button>
        <button class="small-btn" onclick="setMastery('${q.id}','fuzzy')">标记模糊</button>
        <button class="small-btn" onclick="setMastery('${q.id}','mastered')">标记已掌握</button>
      </div>
    </div>`;
  const card = document.getElementById('qCard');
  card.classList.add('answered');
  card.onclick = (event) => {
    if (!answered) return;
    if (event.target.closest('button') || event.target.closest('.option-item')) return;
    nextQ();
  };
  document.getElementById('navRow').style.display = 'flex';
  document.getElementById('scoreBadge').textContent = `正确：${correctCount}`;
  document.getElementById('wrongBadge').textContent = `错题：${getWrongIds().length}`;
  vJRefresh(true);
}

function replayAnswer(record) {
  answered = true;

  renderAnswerResult(record);
}

function judgeAnswer(forceForgot=false) {
  answered = true;
  const q = practiceList[currentIndex];

  const timeStage = getTimeStage(q, elapsedSec);

  const correctSorted = [...correctLetters].sort();

  answeredCount++;
  if (ok) correctCount++;
  const record = {
    index: currentIndex,
    qid: q.id,
    selectedOptions: [...selectedOptions],
    selectedLetters: selectedLetters.join('') || '未选择',

    forceForgot,
    elapsedSec,
    timeStage,
    answeredAt: Date.now()

    timeStage.key === 'slow' ? '慢答，会进入复习池。' :

  document.getElementById('resultBox').innerHTML = `
    <div class="result-box">

      <div class="tap-next-hint" id="masteryNotice">答完后点击题卡空白处，可直接进入下一题。连续快速答对 2 次会自动标记为已掌握；你也可以手动标记。</div>
      <div class="mastery-row">
        <button class="small-btn" onclick="markForgot('${q.id}')">记不住了</button>

        <button class="small-btn" onclick="setMastery('${q.id}','fuzzy')">标记模糊</button>
        <button class="small-btn" onclick="setMastery('${q.id}','mastered')">标记已掌握</button>
      </div>

function renderSessionReview() {
  const rows = Object.values(sessionAnswers).sort((a, b) => a.index - b.index);
  const el = document.getElementById('sessionReviewContent');
  if (!rows.length) {
    el.innerHTML = '<div class="wb-empty">本次还没有已完成的题目。</div>';
    return;
  }
  el.innerHTML = `<div class="review-list">${rows.map(record => {
    const q = practiceList[record.index];
    const chLabel = CHAPTERS.find(c => c.id === q.chapter_id);
    const status = record.ok ? '正确' : (record.forceForgot ? '记不住' : '错误');
    const statusColor = record.ok ? '#237a3a' : '#c0392b';
    return `<div class="session-row">
      <div>
