      </div>
      <button class="small-btn" onclick="jumpToSessionQuestion(${record.index})">查看</button>
    </div>`;
  }).join('')}</div>`;
}

function jumpToSessionQuestion(index) {
  currentIndex = index;
  show('practice');
  renderQuestion();
}

let navigatorPage = 0;
const NAV_PAGE_SIZE = 100;

function goQuestionNavigator() {
  navigatorPage = Math.floor(currentIndex / NAV_PAGE_SIZE);
  renderQuestionNavigator();
  document.getElementById('questionNavigatorDropdown').classList.toggle('open');
}

function closeQuestionNavigator() {
  document.getElementById('questionNavigatorDropdown')?.classList.remove('open');
}

function renderQuestionNavigator() {
  const el = document.getElementById('questionNavigatorDropdown');
  const total = practiceList.length;
  if (!total) {
    el.innerHTML = '<div class="wb-empty">当前没有可导航的题目。</div>';
    return;
  }
  const pageCount = Math.ceil(total / NAV_PAGE_SIZE);
  navigatorPage = Math.max(0, Math.min(navigatorPage, pageCount - 1));
  const start = navigatorPage * NAV_PAGE_SIZE;
  const end = Math.min(start + NAV_PAGE_SIZE, total);
  const buttons = [];
  for (let i = start; i < end; i++) {
    const record = sessionAnswers[i];
    let cls = 'jump-btn';
    if (i === currentIndex) cls += ' current';
    else if (record?.ok) cls += ' done';
    else if (record) cls += ' wrongish';
    buttons.push(`<button class="${cls}" onclick="jumpToPracticeIndex(${i})">第 ${i + 1} 题</button>`);
  }
  el.innerHTML = `
    <div class="review-panel">
      <div class="meta">当前练习共 ${total} 题，第 ${start + 1}-${end} 题。绿色表示已答正确，红色表示错误或记不住，蓝色表示当前题。题目池变化后会自动丢弃旧导航进度。</div>
      <div class="question-jump-grid">${buttons.join('')}</div>
      <div class="pager-row">
        <button class="small-btn" onclick="navigatorPage--;renderQuestionNavigator()" ${navigatorPage === 0 ? 'disabled style="opacity:.45"' : ''}>上一页</button>
        <div class="meta">第 ${navigatorPage + 1} / ${pageCount} 页</div>
        <button class="small-btn" onclick="navigatorPage++;renderQuestionNavigator()" ${navigatorPage >= pageCount - 1 ? 'disabled style="opacity:.45"' : ''}>下一页</button>
      </div>
    </div>`;
}

function jumpToPracticeIndex(index) {
  currentIndex = index;
  closeQuestionNavigator();
  show('practice');
  renderQuestion();
}

function commitSessionAnswers() {
  if (sessionFinalized) return;
  Object.values(sessionAnswers)
    .sort((a, b) => a.index - b.index)
    .forEach(record => {
      if (record.committed) return;
      if (!record.ok && !record.forceForgot) addWrong(record.qid);
      const row = touchStat(record.qid, record.ok, record.elapsedSec, record.timeStage, { forceForgot: record.forceForgot });
      refreshReviewQueueAfterAnswer(record, row);
      record.committed = true;
    });
  sessionFinalized = true;
}

function getSessionSummary() {
  const total = practiceList.length || 0;
  const done = answeredCount || 0;
  const correct = correctCount || 0;
  const unanswered = Math.max(total - done, 0);
  const accuracy = done ? Math.round(correct / done * 100) : 0;
  const progress = total ? Math.round(done / total * 100) : 0;
  return { total, done, correct, unanswered, accuracy, progress };
}

function submitSession() {
  const s = getSessionSummary();
  const message = [
    '确认提交本次练习吗？',
    '',
    `当前题目：${s.total} 题`,
    `已答：${s.done} 题`,
    `未答：${s.unanswered} 题`,
    `正确：${s.correct} 题`,
    `正确率：${s.accuracy}%`,
    `完成进度：${s.progress}%`,
    '',
    '提交后会按本次答题情况更新错题和不熟悉记录，并结束本次进度。'
  ].join('\n');
  if (!confirm(message)) return;
  showFinish(true);
}

function showFinish(manualSubmit=false) {
  stopExamTimer(false);
  commitSessionAnswers();
  clearPracticeProgress(currentPractice);
  const s = getSessionSummary();
  const suggestion = s.accuracy >= 85 ? '状态不错，接下来优先清理错题本。' : s.accuracy >= 70 ? '建议再刷一轮高频错题和多选专项。' : '建议回到薄弱章节，先按章节复习再模拟。';
  const title = manualSubmit ? '本次练习已提交' : '练习完成';
  document.querySelector('.modal-title').textContent = title;
  document.getElementById('finishBody').innerHTML =
    `本次完成 <strong>${s.done}</strong> / ${s.total} 题，进度 <strong>${s.progress}%</strong><br>未答 <strong>${s.unanswered}</strong> 题<br>正确 <strong>${s.correct}</strong> 题，正确率 <strong>${s.accuracy}%</strong><br>错题本共 <strong>${getWrongIds().length}</strong> 道<br>${suggestion}`;
  document.getElementById('finishOverlay').classList.add('show');
}

function goWrongBook() { show('wrongbook'); renderWrongBook(); }
function renderWrongBook(view='list') {
  const stats = getStats();
  const wrongQs = view === 'scan' ? getSortedWrong('recent') : getSortedWrong('all');
  const el = document.getElementById('wbContent');
  if (!wrongQs.length) { el.innerHTML = '<div class="wb-empty">暂无错题，继续加油！</div>'; return; }
  el.innerHTML = wrongQs.map(q => {
    const chLabel = CHAPTERS.find(c => c.id === q.chapter_id);
    const row = stats[q.id] || {};
    return `<div class="wb-item">
      <div class="meta">${chLabel ? chLabel.name : ''} · ${isMulti(q) ? '多选题' : '单选题'} · 错 ${row.wrong || 0} 次 · 慢答 ${row.slow || 0} 次 · 记不住 ${row.forgot || 0} 次 · 状态：${statusLabel(row.status)}</div>
      <div class="wb-stem">${view === 'scan' ? q.stem : (q.stem.length > 110 ? q.stem.slice(0, 110) + '…' : q.stem)}</div>
      <div class="wb-answer"><strong>正确答案</strong><span>${q.answer}</span></div>
      ${view === 'scan' && q.explanation ? `<div class="explanation" style="margin-top:10px"><div class="expl-title">题目解析</div>${q.explanation}</div>` : ''}
      <div class="wb-actions">
        <button class="small-btn" onclick="startSingleWrong('${q.id}')">练这题</button>
        <button class="small-btn" onclick="setMastery('${q.id}','fuzzy')">标记模糊</button>
        <button class="small-btn" onclick="setMastery('${q.id}','mastered')">已掌握</button>
        <button class="small-btn" onclick="removeWrong('${q.id}');renderWrongBook('${view}');initHome()">移除</button>
      </div>
    </div>`;
  }).join('');
}
function statusLabel(status) {
  if (status === 'mastered') return '已掌握';
  if (status === 'fuzzy') return '模糊';
  if (status === 'unmastered') return '未掌握';
  return '未标记';
}
function startSingleWrong(qid) {
  const q = questionById(qid);
  if (!q) return;
  currentPractice = 'single:' + qid;
  practiceList = [q];
  currentIndex = 0; correctCount = 0; answeredCount = 0;
  sessionAnswers = {};
  show('practice');
  renderQuestion();
}

function startExamTimer() {
  examStartedAt = Date.now();
  document.getElementById('timerBadge').style.display = 'block';
  examTimer = setInterval(() => {
    const sec = Math.floor((Date.now() - examStartedAt) / 1000);
    const mm = String(Math.floor(sec / 60)).padStart(2, '0');
    const ss = String(sec % 60).padStart(2, '0');
    document.getElementById('timerBadge').textContent = `${mm}:${ss}`;
  }, 1000);
}
function stopExamTimer(hide=true) {
  if (examTimer) clearInterval(examTimer);
  examTimer = null;
  if (hide) document.getElementById('timerBadge').style.display = 'none';
}

function goHome() {
  savePracticeProgress();
  stopExamTimer();
  closeQuestionNavigator();
  document.getElementById('finishOverlay').classList.remove('show');
  show('home');
  initHome();
}
function show(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(page).classList.add('active');
}

bootTrial();
</script>
<script>
window.__LIAN_FULL__ = {"1": "信号是‘避税天堂＋查不到真实业务和老板’，说白了看不清背后是谁。这种藏实控人的（空壳、代名人、离岸）都要做 EDD、把受益所有人查清楚。", "2": "钱刚存进来就要全转走、还分散打到三个不同国家，最反常的就是这步。单选一时挑‘最没商业理由、最像掩盖去向’的那笔。", "3": "新法一立，现存客户也得覆盖，所以要主动通知他们补交信息。别选‘需要时再做’——监管都明令了，现在就是必要时。", "4": "黑市比索兑换是靠国际贸易加存款机构洗贩毒钱的老套路。凡是贸易洗钱都跟跨境、价格或单据造假连在一起。", "5": "非营利组织跨境多、现金多、还有公众信任，容易被恐怖融资借壳。FATF 的思路是确保钱真用在合法用途、别被偷偷挪走，而不是把 NPO 禁掉。", "6": "用已经进了银行的黑钱去买豪车，是三阶段里最后一步‘融合’（变成合法资产）。前两步是放置（存现金）和离析（多次转移打乱来源）。", "7": "众筹里最可疑的是‘刚发起就秒完成’——不像真募资，像自导自演走账。社交媒体、众筹这些新募资渠道都要盯这种反常节奏。", "8": "餐馆现金反而变少、却装了台私人 ATM，是拿它给非法现金洗白入账。新型支付、取现设备是把黑现金塞进系统的口子，重点看。", "9": "保险里年金最好被利用——用非法钱买，之后按月领‘合法’收益流。人寿和年金是保险洗钱的重灾区。", "10": "恐怖组织要‘不留痕’地转钱，最原始也最难查的就是现金快递。凡强调‘不留审计线索’，就往现金、地下钱庄这类脱离银行体系的方式想。", "11": "个人故意违规，面临的‘监管风险’是罚款加行业名声受损（Haider 案）。注意这问的是监管风险，不是坐牢那种法律风险。", "12": "前台公司把黑钱混进合法生意、再低价倾销，挤垮真正守规矩的同行——损害合法私营部门，是洗钱对微观经济的典型危害。", "13": "客户死活不肯报真实身份，就该停下别做了——身份都验不了，后面全免谈。‘拒绝提供身份或资料’在 CAMS 里几乎是终止关系的红线。", "14": "某国反洗钱有重大缺陷，FATF 最重的一招是号召各国对它采取应对措施（对应黑名单）；较轻的是列入加强监测的灰名单。", "15": "这题抠‘资助’落在哪——真正掏钱给制片人和记者的那笔才算恐怖融资，其余只是宣传认同。资助＝有资金实际流向。", "16": "买艺术品最典型的红旗，就是‘没正当理由却要大额现金’。艺术、古董、奢侈品这类高价值物，现金支付基本都要警惕。", "17": "要不要进反洗钱薄弱的地区，看的是地理（地域）风险。风险评估三大块：地域、客户、产品，这题落在地域。", "18": "先用现金买一堆本票再进银行，是把黑现金换成‘干净票据’的处置手法。反常点在于‘为什么要先用现金买本票’。", "19": "风险是动态的，产品、客户、环境都在变，所以评估要定期更新，才能真实反映当前风险。", "20": "钱在客户能力范围内不奇怪，奇怪的是它经由一个‘反洗钱管得松’的辖区的公司付进来——高风险辖区就是那个红旗。", "21": "把现金塞进赌场扑克机、不玩就用支票领走，目的就是把黑钱洗成‘合法赢利’。赌场洗钱的核心是让非法资金合法化。", "22": "刚借出钱就取消保单、还满不在乎罚金，说明他要的从来不是保险，是那张‘合法’支票。对罚金异常不在乎就是红旗。", "23": "房产洗钱查什么都不如查‘钱最后归谁’——实际受益所有人最关键。任何洗钱案，锁定最终受益人永远优先。", "24": "现金买大量筹码、几乎不玩就换成支票，是赌场里把黑钱换‘干净票’的经典处置或离析手法。", "25": "买房用‘代名人’出面，就是要把真买家藏起来——高风险。代名人、不肯补资料都是房产洗钱红旗。", "26": "两个人频繁汇给同一个收款人、每次都‘刚好低于报告线’，就是拆分规避。看到‘总比门槛低一点’基本就是它。", "27": "非本行客户、来源不明，还反复往几张预付卡里塞大额现金，正是处置阶段的口子。预付卡＋现金＋来源不清＝洗钱风险。", "28": "跨境、快、能层层转移——国际电汇的洗钱风险最高，是分层转移资金最趁手的工具。", "29": "出口老是压低报价，就是典型的贸易洗钱（低开发票向境外转移价值）。贸易洗钱看价格、数量、质量对不对得上。", "30": "客户干起了支票兑现（货币服务业务）却没登记，就是无牌经营 MSB——该终止关系。MSB 未注册是硬伤。", "31": "律师账户短期收到多笔来路不明电汇、又层层转出，最可疑的是‘凭空冒出的多笔汇款’——为什么不直接进律所账户？", "32": "犹豫期能‘退保不罚款’，正好被拿来快进快出、拿一张合法支票洗白。撤销期无罚金就是洗钱帮凶。", "33": "老客户突然收购一堆‘新成立的空壳公司’，多半是拿来藏实控人和资金来源——会的。空壳公司专门用来隐匿所有权。", "34": "靠篡改交易单据来转钱，就是基于贸易的洗钱（虚报价格、数量、质量）。", "35": "把犯罪现金存进银行账户，就是三阶段第一步‘处置’；其余多次转移属于离析（分层）。", "36": "申请人自己说‘受益人其实是文件里没提的另一个人的代名人’，等于承认在藏真老板——最明显的隐瞒所有权信号。", "37": "违反反洗钱义务，最重的后果是丢牌照——有效反洗钱制度是持牌前提。罚款还能扛，执照没了就完了。", "38": "想让加密资产不被执法查获，就用自托管钱包、再不断换新的捐赠地址来打散。", "39": "上游犯罪不查、洗钱不究，最直接的社会后果是有组织犯罪和腐败越来越多，这是洗钱宏观危害里的头一条。", "40": "把电汇里‘受制裁公司’的信息删掉再放行，就是电汇剥离。制裁归 OFAC 管，命中就得冻结、上报，不是放过去；看到‘删改或隐藏电汇信息’基本就是它。", "41": "要求把赢的钱开给‘第三方’、或收款人不明，是赌场洗钱红旗。钱和人对不上就要警惕。", "42": "不记名股票谁拿着算谁的、转手也不登记，天生用来藏所有权，所以是洗钱工具。", "43": "系统性地高价买、低价卖同一只票，稳定亏损其实是把钱‘送’给对手方——变相转移价值。", "44": "律师、会计师这些守门人，关键作用是自己也建反洗钱程序：识别客户、做尽调、留记录、报可疑。", "45": "投保人对保单成本、罚金完全不在乎，说明他要的不是保障——典型保险洗钱红旗。", "46": "集团层面做风险评估，是为了摸清整体洗钱和恐怖融资风险，再配上够用的控制去降低它。", "47": "新增了会用新产品的客户群，就得更新一线培训——面向客户的员工是第一道防线，产品变了培训也得跟上。", "48": "没报可疑欺诈，可能被受害人起诉索赔——这属于法律风险（诉讼、判赔、罚金）。", "49": "反复汇给同一个收款人、又跟业务对不上，就是资金转移红旗。核心看‘和业务、历史是否相符’。", "50": "洗钱丑闻最典型的声誉后果，是高端客户流失、没人愿意再跟你往来。", "51": "同样是充值，加密货币最难追、洗钱风险最大——它能绕开银行把价值转到全球。", "52": "国内公司突然收到一家‘从没往来、也没这需求’的境外企业电汇，双方没有明显业务关系，就该升级为可疑。", "53": "客户不在乎费用、还有亲属在目标公司上班，冲着内幕信息来的。交易透着‘知道别人不知道的’就往内幕想。", "54": "代理行的下游若是货币服务企业（MSB）这类高风险客户，整条代理关系的风险就上来了。", "55": "报完 SAR，调查员下一步是给高管写份摘要、建议退出这个客户。别自己去报 FBI、也别乱冻账户。", "56": "两三个人各买点筹码、只象征性玩两把，就把钱凑一起要一张赌场支票——典型赌场洗钱。反常在‘几乎不玩却要把现金换成票’。", "57": "零售银行天生最相关的固有风险就是现金服务——现金最难追。风险评估按地域、客户、产品看，这题落在产品服务上。", "58": "经常性的小额现金存款，就是‘微型拆分’——和拆分一个道理，只是金额更碎。看到‘频繁小额现金’往拆分想。", "59": "律师这类守门人最容易被冒用、盗用身份来办事。守门人（律师、会计、公司服务商）本身就是高风险节点。", "60": "证券里‘转了券却没对应付款’（无偿资产转让）最可疑——价值在偷偷转移。资本市场洗钱盯‘券和钱对不上’。", "61": "买奢侈品用现金最可疑——金额大、又好二手变现。高价值物加来路不明现金就是红旗。", "62": "私人投资公司常设在有严格保密法的离岸地，专门替所有人挡住身份，所以容易被洗钱利用。离岸加保密就是藏人。", "63": "个人数据一旦泄露，就被拿去盗用身份——网络诈骗基本都从信息泄露开始。", "64": "新客户一上来就大额、专挑高流动性或高价证券‘即来即走’，最让人担心。大额加高流动性加快进快出就是红旗。", "1321": "个人违反反洗钱，可能挨民事或刑事罚款，还有监禁、内部处分直到解聘。这是落到‘人’头上的处罚。", "1322": "贷款挂在一家‘所有人不披露’的 LLC 名下、还多还钱，最可疑的就是不披露实控人。LLC 的匿名性正是犯罪分子看中的。", "2376": "通过货币兑换所或 MSB 电汇、每次都‘略低于报告线’给同一个人，就是拆分规避。看到‘刚好低于门槛’就是它。", "2380": "网络赌博适合洗钱，核心是它能‘跨司法管辖区转移价值’，绕开监管和追踪。", "2381": "冒充合法来源发邮件、诱你点链接填个人信息，这是钓鱼；针对特定人或公司的叫矛式（鱼叉式）网络钓鱼。", "2382": "多笔现金存款都‘略低于申报线’，是为规避申报、藏来源去向——洗钱风险最高。本质还是拆分。", "2383": "客户经理担保介绍去离岸开公司，最大风险是那个离岸地‘隐私法强、执法拿不到信息’——高风险辖区盖过其他因素。", "2384": "账户沉寂许久突然多笔小额跨境汇出，要评估恐怖融资，就得先确认‘收款人不在恐怖名单上’。TF 的关键是比对名单。", "2385": "古董价值高又好搬运，方便藏钱、转移，所以对洗钱有帮助，跟艺术品一个路子。", "2386": "用小面额钞票买筹码、不玩就换赌场支票，明显不是来玩的——洗钱/恐怖融资风险最高，‘只换不玩’是核心信号。", "2387": "员工无意中帮了拆分客户，正确处理是给他们做补救培训，别一上来就开除或报警。培训是首选纠正。", "2388": "洗钱三阶段（处置、离析、融合）里，把犯罪所得投进金融系统的第一步就是‘处置’。", "2389": "老板每天换不同柜员、存低于报告线的现金，就是拆分——化整为零规避申报。", "2390": "往保密辖区的公司转账触发警报，最能坐实嫌疑的是那家公司有‘无记名股票’——所有权不明。", "2391": "互联网银行不见面，最要紧的建议就是把新客户身份识别对——识别客户是反洗钱的地基。", "2392": "金融机构一般禁止雇用‘涉及不诚实’罪行的人——这类罪直接关系诚信；酒驾、绑架跟金融诚信关系小。", "2393": "拿几笔低于一万美元的现金、分存到多家分行，就是拆分的标准例子（化整为零躲报告）。", "2394": "客户涉上游犯罪，代理账户里的钱就有被扣押风险，而且不限于在美国境内使用——别以为出了美国就安全。", "2395": "慈善账户‘把钱付给跟慈善目的无关的实体’，是资助恐怖主义的最高风险——钱的流向对不上宗旨。", "2396": "洗钱主要冲击金融部门，而金融部门是经济增长的命脉，所以危害深远。", "2397": "想把钱从塞浦路斯挪到英国，靠‘对发货虚开高发票’，多出来的钱就合法流走了。贸易洗钱＝发票和货值对不上。", "2398": "罚款、制裁、起诉是直接后果；声誉受损带崩股价，是‘间接’后果。问间接就选股价、声誉这类连锁反应。", "2399": "一家地毯清洁公司却把九成收入以现金付给无关个人，最可疑——大额现金流向对不上生意。", "2713": "供应商把服务提供给‘受制裁地区的最终用户’，会同时踩反洗钱和制裁风险。看最终用户在不在制裁范围。", "2715": "一家私人公司借赌场把钱分散打进多个赌客投注账户，明显是借赌场洗钱——钱和赌博行为对不上。", "2716": "律师信托账户老收高风险国的不明汇款、又原额转给低风险国的人，就是过账洗钱：来路不明加快进快出。", "2717": "收到客户传票，正确做法是审查其交易、完整回复传票——别一收传票就报 SAR，也别草率关户。", "2718": "有效的企业级风险评估（EWRA）要针对高风险客户、产品、地区配上相应控制去降风险，不能只照搬第三方框架。", "2719": "经济制裁的目的，是逼那些威胁本国利益或违反国际准则的国家、组织去改变行为。", "2721": "联合国制裁作为最有合法性的非暴力手段，理想状态是‘各国迅速通过、执行有力’——多边且有效。", "2722": "本国 FIU 要外国的资金信息来判断能否起诉，靠的是加入埃格蒙特集团、彼此请求协助。FIU 换情报走埃格蒙特。", "2725": "第三道防线（审计）要直接向董事会审计委员会报告，才能保持独立。审计＝独立、向董事会汇报。", "2727": "一只低价股突然被爆买、价格拉升，像是有人操纵洗钱。资本市场看‘反常的量价异动’。", "2731": "客户对大额纸币的需求变多，往往是要用现金掩盖来源——存款机构里的洗钱信号。", "2734": "用存进的钱下注、再跟别的玩家串通把钱‘输’过去以掩盖来源，这叫筹码倾倒（在线赌博洗钱）。", "2736": "反复自买自卖、一方稳赚一方稳亏、全程没有真实市场风险，这是洗售交易（做量、转移价值）。", "2737": "用现金买限量奢侈手表、还要手写收据，现金不透明加票据难追，是贵金属/高价值物经销商处的洗钱预警。", "2738": "风险为本（RBA）的好处是能按风险高低灵活配资源、把力气用在真正高风险的地方。", "65": "拿最新制裁信息，靠美国财政部 OFAC 和爱国者法案 311 条特别措施这两处。制裁信息＝OFAC 家的东西。", "66": "带一大笔筹码来、最后要把兑现的钱汇给‘无关联的人’，这两点最像洗钱。钱最终流向无关第三方是关键红旗。", "67": "查这类洗钱，就顺着货币兑换所的存款（含按序编号的票据）、以及它发往‘没商业关系’辖区的多笔电汇去追。", "68": "会计师常见洗钱套路：虚高收入藏现金、当账户间的现金通道、替想藏身份的客户当代理人。", "70": "纸质证券风险在两点：券商看不清买券的钱哪来的；证书能直接发给名义持有人、还能场外转，藏得住实际受益人。", "71": "空壳公司（在 BVI 注册、查不到所有权）加上运的货跟双方正常业务对不上，这两点指向贸易洗钱。", "72": "洗钱给机构带来的后果：盈利业务流失，以及调查费用和罚款上升。", "73": "该上报的两点：客户把要办的业务讲得云里雾里、自己都不懂；以及给不出受益所有人信息——都是想藏。", "74": "前台公司两大好处就是混钱藏来源、低价倾销挤垮同行，甚至控住整个行业。多选全选才得分，注意混同存款和控制经济部门都要选。", "75": "老客户玩极端政治不可怕，可怕的是账户突然大额异动、还连累银行名声。多选全选才得分，注意异常资金加声誉风险才能销户，行业和纠纷都不够。", "76": "证券洗钱两大命门：经纪人能当代名人藏住真老板，交易还快到来不及查。多选全选才得分，注意代名持有和交易速度都要选。", "77": "黄金好洗钱就因小值大、化了重铸还保值，揣兜里就能带出境。多选全选才得分，注意易熔塑形和体积小价值高都要选。", "78": "恐怖分子搞钱靠人货两路：贩人口、走私文化品文物换钱花。多选全选才得分，注意人口贩卖和文化品走私都要选，内战电汇只是幌子。", "79": "传销账户借贷乱、跨境多还往个人账户倒钱，查法就是顺资金链扒、再拿情报比对。多选全选才得分，注意追资金流和比对可疑交易都要选。", "81": "汇丰和解记住两板子：财产被没收再加民事罚款，罚到肉疼。多选全选才得分，注意罚没财产和民事罚款都要选，吊销坐牢不是这案。", "82": "贸易洗钱看两处别扭：没理由绕道第三国，货量单价跟以前完全对不上。多选全选才得分，注意无故转运和规模数量不符都要选。", "83": "油画十年翻倍不稀奇，稀奇的是离岸账户付款还查不到真老板。多选全选才得分，注意离岸付款和无法核实实控人都要选。", "85": "警方让你别关户继续盯，必须先拿到盖公章的书面请求，记录至少留五年。多选全选才得分，注意书面授权和五年留痕都要选，报不报SAR另说。", "86": "虚拟货币开业前先扎好两道篱笆：客户是谁要验明白，交易额度要按风险设限。多选全选才得分，注意客户加入流程和风险限额都要选。", "87": "律师最该警惕的不是LLC本身，而是高官PEP加多国拼凑的房款，钱和权都说不清。多选全选才得分，注意政府高官和多国来源资金都要选。", "88": "赌场拆分两招：多桌小额买筹码化整为零，再经第三方过手断链。多选全选才得分，注意分散买码和第三方交易都要选。", "89": "贵金属商防洗钱盯住钱和人：不给物主之外的人付款，身份不明的不卖。多选全选才得分，注意拒付给非物主和限制无身份信息购买都要选。", "90": "全球管洗钱别只盯本地：按集团政策建流程、立规矩控全集团风险，再把执行管到底。三选全选才得分，注意全球政策、集团风控和贯穿落实都要选。", "91": "腐败国总统的儿子两年从七百万涨到五个亿，PEP亲属加暴富就是最硬的两面红旗。多选全选才得分，注意PEP家属和财富暴增都要选。", "92": "赌场客户风险看人和关系：临时生面孔最难查，拿第三方当幌子最能藏。多选全选才得分，注意临时顾客和不当用第三方都要选。", "93": "前台公司就是犯罪分子的马甲：黑白钱混一锅藏来源，攒多了还能控整个行业。多选全选才得分，注意混合存款和控制经济部门都要选。", "94": "洗钱放任不管，银行先被掏空失信，街上混混贪官越来越多。多选全选才得分，注意削弱金融机构和滋生有组织犯罪都要选。", "95": "非法伐木三件套：关联账户钱倒来倒去、当官的亲戚站台、木头大老远火速拉走。三选全选才得分，注意关联交易、PEP关联和异地快运都要选。", "96": "信托公司服务商的坑就两处：钱莫名其妙跨境乱飞，公司还躲在保密法后面。多选全选才得分，注意无目的跨境电汇和保密辖区法人都要选。", "97": "赢五万多本身不洗钱，洗钱的是赢完就往境外个人账户全转走。多选全选才得分，注意大额跨境转账和全额转境外都要选，境内归集不算。", "98": "外国警察上门通缉人口贩子，别直接交资料，先告诉本地警察和监管，再自查上报。多选全选才得分，注意通知本地执法监管和审查上报都要选。", "99": "网赌洗钱看登录和身份：PEP开户要盯，多国异地登录像团伙作案。多选全选才得分，注意PEP玩家和多国登录都要选。", "100": "保险洗钱的人不心疼钱：多交钱也硬退、宁可贴罚金，债券没到期就打折赎回套现。多选全选才得分，注意超额投保硬退和折价赎回都要选。", "2400": "MSB洗钱两张脸：同一人在多地短时间连刷，多人共用一个身份各玩各的。多选全选才得分，注意多地交易和共用身份都要选。", "2401": "国际商业公司风险就两条：名义董事挡着看不见真老板，窝在避税天堂没人管。多选全选才得分，注意名义董事和避税天堂都要选。", "2402": "学生硬买高估房三处别扭：价格虚高、跟经纪人唱反调、还催着快成交。三选全选才得分，注意价值不符、不一致和交易速度都要选。", "2403": "高风险国保单每月有陌生人塞现金，月底就定期往外提，这就是拿保险走账。多选全选才得分，注意不明第三方存款和定期退出都要选。", "2404": "赌场三招最脏：奖金开给第三方、熟人故意输钱送码、钱打到反洗钱洼地。三选全选才得分，注意第三方支票、假输和转往弱监管国都要选。", "2405": "人穷久了就铤而走险：经济差没工作，黑帮腐败还天天招手。多选全选才得分，注意经济疲软和接触有组织犯罪都要选。", "2406": "给客户打分就看三围：人在哪、是干啥的、玩啥产品最要紧。三选全选才得分，注意地理、客户和产品风险都要选，信用欺诈先靠边。", "2714": "会计想发现客户变味，得盯住他是啥公司、来办啥业务内容。多选全选才得分，注意公司实体情况和服务主题都要选，合作多久不重要。", "2720": "藏人三件套透明度最低：代持董事股东、不记名股票、躲保密天堂的私人投资公司。三选全选才得分，注意代持、不记名股票和保密PIC都要选。", "2723": "风险偏好声明就是定规矩：拿指标划出红线不许超，再让全公司上下都认这条线。多选全选才得分，注意设定限度和统一风险容忍都要选。", "2724": "欧盟抠数据就两招：能少收就少收，玩AI必须守严规矩才行。多选全选才得分，注意数据最小化和AI严格方针都要选。", "2726": "管数据别贪多：只收监控够用的部分，政策还要常回头看看。多选全选才得分，注意数据最小化和定期审查更新都要选。", "2728": "人口贩运的钱味很重：广告费付得又频又散，进来的转账还没付款人信息。多选全选才得分，注意频繁广告费和缺失付款人信息都要选。", "2729": "公证员盯两处：资产挂在离岸公司名下，贱卖还不解释为啥便宜。多选全选才得分，注意离岸持有和低价无解释都要选。", "2730": "文物洗钱三招：藏免税仓库不见光、雇顾问挡真买家、社媒上高价单件出手。三选全选才得分，注意免税存储、第三方顾问和社媒销售都要选。", "2732": "风险偏好别锁抽屉：写进报告天天见、融进流程天天用、培训到人人懂。三选全选才得分，注意纳入报告、融入流程和员工培训都要选。", "2733": "洗钱多了国家就蔫：老百姓不信银行了，老外也不敢来投钱了。多选全选才得分，注意动摇金融信心和阻碍外资都要选。", "2735": "高价值艺术品三招最悬：免税区仓库藏、第三方顾问挡、社媒高价卖。三选全选才得分，注意免税存储、第三方顾问和社媒销售都要选。", "101": "爱国者法案311条专治境外首要洗钱地和问题银行，财政部能直接加特别措施管住它，看到311就往特别措施想。", "102": "PEP今天不是明天可能是，所以开户查一次远远不够，之后还得定期回头看，单选就认开户加定期审查。", "103": "埃格蒙特就是各国FIU的群聊，拉进来通气合作，一起反洗钱反恐融资，记住论坛二字别把它当成执法队抓人。", "104": "巴塞尔KYC别背偏了，最核心的就是客户接纳政策这关，什么人能进门先定规矩，它是四要素之首，后面三项都围着它转。", "105": "外国银行想开美国代理户，先交出能在美国接传票的人，这是319条点名要的东西，没有接传票的人户就开不了。", "106": "代理账户最大坑是下游银行KYC放水，钱背后到底是谁你都看不清，管代理户先看对方KYC成色，成色差就别开。", "107": "私人银行开新户，客户经理一人说了不算，还得再拉一个人双签，这是沃氏防独断的规矩，双人批才合规。", "108": "FATF式区域组织不罚人，主要活是给成员国送技术援助，帮它们把FATF建议落地，罚人和管银行都是各国自己的事。", "109": "审计发现合规放水还违法，别搞私了，直接写进报告捅到董事会，合规专员再熟也捂不住，审计直通董事会。", "110": "欧盟四号令记住一本账：法人信托的真老板必须进集中登记册，有关部门都能查，藏老板的时代结束了。", "111": "埃格蒙特目标就一句：找办法让各国FIU多发育，多串情报多交流经验，串得越多配合越熟，论坛越办越热。", "112": "OFAC和联合国看似各管各，最大公约数就是断了恐怖分子的钱路，考相似点只认断恐融资这一条，谁断钱路谁就是同道。", "113": "FATF互评估考两张卷：条文抄没抄看技术合规，落地灵不灵看有效性，光背条文不落地等于零，两张卷子都要拿分。", "114": "FIU的活就是情报二传手：收下可疑报告分析完，再分给警察和外国FIU，自己从不直接抓人，抓人是警察的活。", "115": "互评估别光看立了法，要拿出证据来：制度真把洗钱恐怖融资按住了才算数，纸面合规糊弄不了人。", "116": "新技术最要盯的就是不见面交易，人不到场身份最容易造假，FATF点名非面对面交易风险最高，不见面就要加料查。", "117": "FIU站在中间当桥：一头接着报告义务的情报，一头送给执法那边拿去用，两边一接案子就通了，桥断了案子就卡壳。", "118": "OFAC最吓人的是罚单：敢违反冻结令，不管哪国人都能下重罚，巴黎银行天价罚单就是下场，撞红线就破产。", "119": "监控系统别迷信出厂设置，要按自家风险调参，上线前先做集成测试加用户验收，拿来主义必翻车。", "120": "区域组织核心活是帮成员把FATF标准真装进自家制度里，技术援助加互评估双管齐下，落地是硬道理。", "121": "高风险代理行想过门，得先让高级管理层点头批准，这就是沃氏EDD的架子，经理签字可不算数，高管点头才算数。", "122": "爱国者312条专啃两块硬骨头：外国人的代理户和私人银行户，普通存贷它不管，考312先想这两户，其他账户别上当。", "123": "FSRB从不另起炉灶，死认FATF的活法，平行着帮本地区把标准落地，记住平行二字是考点，另起炉灶就是错的。", "124": "沃尔夫斯堡从不立法，只给银行圈递行业经验谈金融犯罪风险管理，行业观点四个字就是考点，立法可不是它。", "125": "FSRB手里就两板斧：搞培训、搞互评，拉着成员把40条当自家法落实，可别记成罚人，罚人可没它的事儿，它只管搭台培训和组织互评。", "126": "母国严东道松就从严跟母国，东道实在不让才另想办法，记住取高不取低这四字诀，低标准直接扔。", "127": "警察要资料别硬顶也别全倒，先把要啥锁定准再又快又全回复，拖和躲都会惹麻烦上身，老实配合最省事。", "128": "警察口头说别关户可别就信了，让他拿公函信纸写明白再配合，不然事后根本说不清，书面才是护身符。", "129": "FSRB摸清本地区风险不靠拍脑袋，靠抄FATF作业：用它的模板做区域版类型研究，模板用对才得分，区域风险画像越画越准。", "130": "OFAC专管美国人：公民绿卡、境内人、在美注册的公司及分支全都得听，沾上美国边就要管，全球追着管，躲到哪都躲不掉OFAC的罚单。", "131": "FATF点名问题辖区一年三刷、每次两份榜单，让全世界都看见到底谁在掉队等补考，点名不改就升级，两份榜单一刷谁都藏不住。", "132": "被FATF公开声明点名的，就是战略缺陷太大、得上应对措施的那一档，灰名单还要轻一级，公开声明是最重的一档。", "133": "制裁名单天天变，只靠开户加季度筛可不够，名单一更新就得重筛跟上，这才算合规，季度筛只是底线。", "134": "欧盟四号令把商品经销商现金线从一万五砍到一万欧，超了这条线就得报可疑，一万是考点，多一分都不行。", "135": "国家打恐怖融资先定罪再说：出钱给恐袭组织人，哪怕钱没花出去也算犯法，资助即罪，钱动没动不重要。", "136": "FATF透明度专啃法人和法律安排：公司信托背后的真老板必须露脸，一个都别想藏，法人信托全覆盖，揪出真老板是第一步。", "137": "下游嵌了多少小银行、分布在哪、有没有爆过雷，代理行都得摸一遍，看不懂就别做，做了就要背锅，下游一爆雷代理行先遭殃。", "138": "给公司开户先画股权图：结构谁控、钱从哪来、真老板是谁，一个都不能少，专防匿名壳，壳公司当场现形。", "139": "不见面开户也别给匿名留门，文件该验就验，咬死不见匿名客，这是巴塞尔的底线，匿名客一律关门。", "140": "埃格蒙特对成员的最大加持：把各国FIU拉进互惠网里，情报换得又多又顺，越换越熟，网越大情报越多。", "141": "FIU就是全国可疑报告总入口：STR收进来分析完，再往外分送各家执法和外国FIU，一进一出天天转不停，总入口一堵全国都断流。", "142": "银行查出洗钱别直接报警察，STR先交自家FIU，它才是法定的收货人，千万别送错门，送错门就白查，FIU才是法定的第一收货人。", "143": "埃格蒙特主业一句话：给FIU搭台子，让合作和信息交换更好使更顺畅，论坛是本体，唱戏的是各国FIU，台子搭好合作自然来。", "144": "某地反洗钱太松懈，FATF就喊话成员：对它上应对措施，千万别客气手软，这就是公开声明加持压，不听话就升级。", "145": "新股东不掏钱也得查：关系先问清，身份背景名声走一遍，不出钱的更像白手套，盯死他，不掏钱还占股的股东最像影子老板。", "146": "互评估本质就是作业检查：FATF建议在你家到底执行了几成，评的是执行不是态度，态度好没用，执行分才是互评估的硬通货。", "147": "跨境代理想开门，先找银行高层批条子，这是FATF点名的硬动作，经理签字可不算数，高管批条才算数，跨境代理的门只认高层签字。", "148": "美国查外国银行代理户，留的是25%大股东身份和在美接传票的人，两样都要留好备查，少一样就违规。", "149": "OFAC审计别查虚的，就抠电汇筛查：删改藏受制裁人信息的活能不能抓住，巴黎银行就是前车之鉴，罚到破产。", "150": "爱国者319条长臂够长：境外银行也得120小时内交记录传票，美国这边照样能要到手，长臂专治躲猫猫，过期不交就翻脸。", "151": "制裁说到底是外交大棒：为国家安全和外交目标出手，逼对方改行为，不是为做生意，改行为才是目的。", "152": "空壳银行画像很直白：没固定地盘、没专职人、不受人查，挂牌等于裸奔，313条见一个拦一个，壳行别想进门。", "153": "PEP开户终审权在高层手里，客户经理说了不算，高管点头才能进门，这是最高规格，高管不点头免谈，PEP业务没背书免开尊口。", "154": "FATF40条虽不是法律条文，却是全球公认的反洗钱标杆，IMF世行评估都认它这面旗，标杆就是它，各国立法都要向它看齐。", "155": "CDD开门最实在的一问：这户开来到底想干啥，预期是个啥性质，预期性质四字背熟，答不上就别开户，预期性质说不清开户就是埋雷。", "156": "KYC做不好四雷连爆：法律声誉运营集中度全塌，最后一定亏大钱，巴塞尔早警告过，四雷一爆全完蛋，KYC偷懒省小钱最后赔大钱。", "157": "FSRB高级别原则记住互惠二字：FATF和区域组织互相认活、互相进场参评，谁也不摆架子，互认互评是常态，谁摆架子谁出局。", "158": "FIU的饭碗就是啃STR数据：收进来分析透，再分出去打洗钱和恐融资，天天如此不停工，报告一到分析就动，分发一刻不停。", "159": "爱国者长臂管域外，核心是防境外金融机构和跨境交易变成洗钱快车道，效力就长在这里，域外照管不误。", "160": "爱国者319条可直接动手：境外银行的黑钱等额从它美国代理户里扣，不用追踪原钱也照扣，等额抵账是绝招。", "161": "真空壳才归爱国者管：在境外无实体经营的空壳行，美国代理户想都别想，有实体才不算壳，三无企业直接出局。", "162": "FATF的CDD不是一锤子买卖：关系存续就得持续盯，交易跟画像对不上就问，画像一变就追问，画像是活的不是死的。", "163": "巴塞尔KYC四件套背顺口：识身份、管风险、定接纳、勤监控，少一件都不行，顺序也别颠倒，四步按序走，识管接监不能跳。", "164": "帮着查恐融资就别拿保密当挡箭牌，保密法挡不住FATF建议的执行，保密二字这时不好使，配合调查优先。", "165": "FIU收的硬通货就是STR可疑交易报告，别的材料都只是配菜，记住报告二字是本体，报告就是命根子，FIU没报告就成了无米之炊。", "166": "欧盟指令目标一句话：全欧盟用一个尺度防洗钱恐融资，堵新花样补缺口，不给漏洞留缝，一个尺度量到底。", "167": "碰上高风险第三国，欧盟要的是真加码：按风险上额外的EDD缓解招数，自愿应付可过不了关，加码必须见血。", "168": "埃格蒙特换情报讲究互惠：主动给、自发给、张口要了就得给，不回话以后就没人理你，互惠才长久，只进不出的下次没人理。", "169": "有效的FIU先有信任打底：国内外都信得过你，才敢把敏感情报交过来，没信任谁敢交底，信任是情报的货币。", "170": "法院传票到了别藏着掖着：高管加律师先过目，没毛病就又快又全交卷，不交就等吃罚单，藐视法庭代价大。", "171": "FATF强化后续不是无限期拖延：五年一到就得回来复检交作业验收，谁都逃不掉这五年之约，到期必须交卷。", "172": "FSRB关键活是撑起互评估体系：帮成员互相照镜子，盯着短板改到位，改完还要跟进再看，互评估盯改一条龙不松劲。", "173": "集团内传SAR也要上锁：保密兜底做足功夫，防泄密是FATF的硬要求，漏了就要挨处分，保密锁必须焊死，集团内泄密一样追责。", "174": "跨国换来的反洗钱情报得当自家的一样护着：只许授权用，还得合隐私法，用错地方也要担责，授权之外别乱碰。", "175": "FIU之间传密件要走专线：埃格蒙特安全网才是组织指定的通道，微信邮件想都别想，专线之外不传密。", "176": "TCSP识客抓住总闸：谁是真控人、钱从哪来、搭这结构到底想干啥，三问一个不能少，少一问就放跑真凶，控人钱源用途锁死。", "177": "机械进出口账里最刺眼的，是给境外无关公司乱付咨询费，空壳味太冲，机械贸易只是幌子，咨询费才是洗钱皮。", "178": "FATF新版灵魂就四个字：风险为本，钱和人力都往最高风险处堆，低风险别浪费子弹，好钢用在刀刃上，风险为本就是把钱花在刀刃上。", "179": "FATF量成效从不看口号，只看互评估这把尺子到底量出几斤几两，口号再响也没用，尺子量出才算数，尺子只认战果不认嗓门。", "180": "被制裁卡住别硬闯，先去OFAC拿许可：通用许可对号入座，特殊许可一事一批，拿证再交易，无证交易就是找罚。", "181": "FIU防洗钱还是老三样：收STR、做分析、往执法和外国FIU分发下去，老三样天天转，转出线索一大串，样样不能停。", "182": "欧盟一号令开宗明义：先把贩毒定成洗钱的上游罪，口子就从毒品开，一号令先立毒罪，毒罪是万罪之源。", "183": "爱国者313条一刀切：在哪都没实体的外国银行，美国代理户一律不给开，认证盖章也没用，一刀切不认情面。", "184": "FSRB区域目标别记偏：盯住本地区新花样，护住金融系统不被坏人滥用，这才是正事，地方新花样必须盯死。", "185": "外国银行的黑钱存境外也跑不掉：美国从它在美代理户里扣等额来抵账，代理户就是抵押物，欠多少扣多少。", "186": "FATF要的是集团一盘棋：全集团统一反洗钱政策，信息该通就要通，别各扫门前雪，雪里埋着雷，分支扫雪集团迟早被炸。", "187": "互评估有效性只问一句：挡住黑钱进金融体系这事，你家到底做成了吗，拿战果说话，战果不行就回炉。", "188": "巴塞尔对高风险客就一招：EDD加码，开户前细审、存续期天天密盯，松一回都不行，盯住才保险，高风险客松一天就可能爆雷。", "189": "互评估双卷必须背牢：技术合规看条文落地，有效性看实战战果，双卷都得及格才算过，偏科就挂科。", "190": "私行EDD点名题：高风险国富豪开户最要加料，本地散户先靠边站，富加贫减四字诀背熟，高风险富豪不开EDD就是裸奔。", "191": "销户终极线只有一条：剩下风险超了自家胃口，再赚钱也得送客，胃口就是风险偏好，超胃口就送客。", "192": "埃格蒙特现在主攻技术活：让FIU之间换情报换得更快、也更安全，又快又稳是方向，技术投入不能省，情报又快又稳全靠技术撑腰。", "193": "巴塞尔CDD先验明正身：客户、受益人、代理人到底是谁，拿证件来说话，空口不认，没证免谈，证件不齐的客户一律挡在门外。", "194": "FSRB看家本事是区域互评：按FATF尺子互相打分，盯着整改到位，不改就继续盯，别想蒙混过关，整改不到位就一直挂着督办。", "2407": "高风险客户进不进门，拍板的是高级管理层，开户小兵可定不了，一线说了不算数，拍板权在顶层，一线只管收材料递话。", "2408": "FATF对烂透的辖区从不客气，直接喊成员上应对措施，逼它赶紧改，不改就加码，喊话不是走过场，应对措施不落实就继续加码。", "2409": "空壳行别想钻空子：美国代理户一律不留，认证地域审批三类借口全堵死，救不了场，谁求情都没用。", "2410": "爱国者对境外行最常用的招就是发传票要文件，把手伸到美国之外，长臂常用招记住它，传票一到就得交。", "2411": "私行代理行反恐融资手法一样：先认准人，再盯紧账，动歪心就现形，两行手法无差别，一套拳打两家。", "2412": "FATF透明度专治各种马甲：法人和法律安排的真老板必须可查可追，马甲再多也扒掉，扒到真老板为止。", "2413": "欧盟三号令给保险留了活口：受益人身份可后补，但赔付或行权前必须验完，超期不验算违规，宽限不是免验。", "2414": "认证表就是委托行写的保证书：我不跟空壳行玩，走我户的也不许玩，连坐担保，敢放就一起罚，委托行担保可不是写着玩的。", "2415": "想从FATF黑名单下来，捷径只有一条：接受互评估并拿出实打实的改进，自评入群都不算数，实改进才认账。", "2416": "律师撞见洗钱别讲保密、也别惊动客户，直接向主管机构交底报告，保密天职这时靠边站，打草惊蛇更坏事。", "2417": "OFAC长臂关键看挂钩：经手跟美国沾边的交易，中间人就得守美国制裁，沾边就得守规矩，不过审就别做。", "2418": "巴塞尔原则别神化：就是给成员和银行的KYC作业指导书，照着做就能避坑，记住建议二字，硬套当法律就错了。", "2419": "董事会想匿高净值身份最犯忌：FATF禁匿名户这条红线第一个就炸响，匿名是高压线，谁碰谁触电出局。", "2420": "SUA定罪门槛其实很高：必须证明被告明知这笔钱到底脏在哪，知情加性质缺一不可，少一样就判不了。", "2421": "政策改来改去为哪般：就为堵住开户KYC的窟窿，别让坏人混进来，堵窟窿是唯一目的，窟窿不堵白改，开户漏一个坏人就白忙。", "2422": "互评估挂科别狡辩：认下短板进后续监测，老老实实整改才是正道，嘴硬只会更被动，老实整改加分。", "2423": "空壳行画像很直白：离岸注册却没地盘没雇员，纯粹就是个空壳，三无就是壳的铁证，对上就出局，无地无员无监管对上就关门。", "2424": "董事会想开匿名后门，撞上的还是FATF那条铁律：不许留匿名账户，谁说情都没用，铁律面前人人平等，董事会再大也大不过禁匿令。", "2425": "执法正式上门要文件，别想着拖延或组织辩护对抗。信号是正式要求，归位是指定专人负责内部调查来准备，配合才是得分点。", "2426": "英国人上了OFAC名单，管你是比利时银行还是纽约分行，钱都得冻住。记住OFAC是长臂管辖，一命中名单就冻结加报告，别想着放行到限额。", "2427": "美国311盯上欧盟行的通汇账户，考点是穿透到用账户的人。美国行会被要求多要下游客户的额外信息，钩子就是三一一等于扒下游客户。", "2428": "律师怀疑客户拿控股公司洗钱，别拿保密特权当挡箭牌。欧盟指令把律师也罩住了，归位就是要向主管当局报可疑，怀疑就得报。", "2429": "行长亲戚开户走后门跳过程序，最要命的是没做尽调。巴塞尔看运营风险，记一句看不清客户就开户，等于把洗钱放进来，风险最高。", "2430": "巴塞尔说内审和合规啥关系，记住内审方法里要含合规风险评估。易混点是内审也要看交易，也要跟合规聊，不是不相往来。", "2431": "被美国点名首要洗钱关注，最狠的是切断它的美元通道。归位是能关部分或全部往来和应付账户，钩子就是点名等于断美元路。", "2432": "巴塞尔客户尽调原则啥性质，不是条约也不是法律，就是给成员和银行的建议。看到最能描述原则就选建议，别拔高成强制协议。", "2433": "啥情况最该关户，不是一张传票，也不是一笔学费，而是触发一堆可疑报告。信号是多个报告叠加，说明这户洗钱风险已经兜不住了。", "2791": "欧盟和FATF都爱谈数据共享，为啥，说白了是让钱更透明保住体系完整。别选成FIU去制裁，FIU只管收集分析，不管罚款。", "2792": "FATF定期点名要加强监管的，就是灰名单。红黄通报是国际刑警抓人的，白名单是没事的，看到加强监管就锁灰名单。", "2793": "爱国者哪条能没收加域外，记三一九甲。钩子是甲等于拿钱，钱在美代理账户里等额扣，三一四是信息共享，别混。", "2794": "FATF四十项建议灵魂就四个字，风险为本。二零一二版核心就是人人都要用风险法，解释说明是公开的，也会随新技术更新。", "2796": "美国法哪句对域外说得对，只有OFAC制裁有长臂，能吓到美国外的机构。保密法没全球旅行规则，没收只看三一九甲，别记错。", "2799": "外国政要开户咋降风险，关键是摸清钱哪来的财哪来的，还要定期更新。订数据库只是识别，提高阈值更是反操作，别被忽悠。", "2800": "两国之间管跨境信息共享的法律文件叫司法互助条约。谅解备忘录没强制力，看到法律文件规范共享就选互助条约。", "2801": "再考查封外国银行在美代理账户的钱，还是三一九甲。和没收考点是同一换皮，记住甲等于扣钱，乙等于要记录加关户。", "2802": "进了灰名单啥意思，不是被踢出体系，也不是交罚款，而是承诺赶紧改互评估出的毛病。灰是有病认治，黑才是最危险。", "2803": "FATF第29条说FIU干啥，就是国家级收可疑报告做分析的中心。不起诉，不搞研发，不给私营实时喂情报，收和分析是本职。", "2806": "反洗钱调查里隐私咋说最准，FIU共享个人数据要记下目的，合规留痕。客户没权随便删报告数据，提交报告也不用客户同意。", "2807": "欧盟第六号令装了啥，是把受益所有权登记的数据准确性加严。扩到众筹足球是五号的事，建中央监管局也不是它。", "2808": "哪道防线专门给董事会吃定心丸，第三道审计。第一道是业务干活，第二道是合规风控，第四道根本不存在，看到保证就选三。", "2809": "巴塞尔说董事会管合规要干啥，要设合规职能，还要批政策管全链条。说只向总裁汇报，不让见董事会，不参与定政策全错。", "2813": "本国FIU想跟外国FIU安全传可疑报告，走埃格蒙特安全网。司法互助是司法协助，国际刑警库和联合国名单都不是传情报的道。", "2816": "沃尔夫斯堡私行原则强调啥，只收看得清的客，资金来源和最终受益人都明确。不是保富人隐私，也不是只管政要，不清不收。", "2817": "三一九甲到底说了啥，美国能从外国银行在美代理账户里扣等额的钱。一百二十小时交记录是别的条，分级措施是三一一，别串。", "2818": "谁必须守OFAC，美国公民绿卡全球管，美企加海外分支全管，在美的人全管。说分支不管，双重不管，只在境内才管全错。", "2980": "替代汇款体系就是银行外的跨境搬钱，靠小店加加密信息对账，没真实货币走，也没身份记录。中东非亚族群那套就往这想。", "3250": "FATF眼里啥情况要想着报可疑，受益人是政要就要警惕。光是核实不了资料，涉加密换法币，付款人是金商，还得到调查那步。", "3251": "巴塞尔二零零一年KYC框架给谁用，给所有国家的银行。不是只给离岸，情报单位或欧洲，钩子是巴塞尔等于全球银行通用标准。", "195": "美国行给海外行开代理户，按三一九乙要两样。多选全选才得分，注意百分之二十五大股东身份和在美注册代理人都要拿。", "196": "离岸牌照外行要开代理户，按三一二要多看两眼。多选全选才得分，注意反洗钱制度信息和非上市一成股东身份都要查。", "197": "沃堡说打恐怖融资银行干啥，多选全选才得分，注意帮执法预防侦测共享信息，和碰到恐怖常用手法要加做尽调都要选。", "198": "私行里谁算普通受益所有人，多选全选才得分，注意最终控制钱的人和钱最终来源要查财富的人都要选，签字的不算。", "199": "代理行可疑监控报告要啥，多选全选才得分，注意把客户风险评级等尽调结果融进来，和定期复审时加上可疑监控都要选。", "200": "私行政策写中间人咋写，多选全选才得分，注意银行要像自己获客一样拿客户信息，和中间人没做好时银行要补做都要选。", "201": "啥让代理客户风险更高要加做尽调，多选全选才得分，注意信息官是政要和给邻国行做连环代理都要选，本地零售不算。", "202": "代理客户所有权管理风险看啥，多选全选才得分，注意是国有公私有别和所有权透不透明，董事会多勤架构多大都不算。", "203": "欧盟五号令要求啥，多选全选才得分，注意扩到虚拟货币服务商和加严高风险第三国标准，保存记录最大化不是这组。", "204": "爱国者对新非美行代理户要解决啥，多选全选才得分，注意先判要不要加做尽调和拿对方反洗钱计划来审，关转手户不对。", "205": "埃格蒙特大目标是啥，多选全选才得分，注意当全球情报单位联合体和搭安全交流平台，定国际标准那是FATF的活。", "206": "OFAC跟美国有关的人咋管，多选全选才得分，注意短期来美的外国人也要守和美国国民全球都要守，子公司脱钩是错的。", "207": "埃格蒙特咋帮情报单位达标，多选全选才得分，注意用技术保安全沟通，把合作扩大系统化，保业务自主权都要选。", "208": "非洲油港巨额贷款担保藏啥信号，多选全选才得分，注意担保公司架构复杂藏保密天堂，和少女靠小健身房巨富不匹配都要选。", "209": "跨境洗钱调查找信息走哪两条，多选全选才得分，注意找外国现有联络官和国家执法间交流，正式请求才给信息是错的。", "210": "欧盟洗钱指令哪两句真，多选全选才得分，注意只适用于成员国和要成员立法落实，说非强制最佳实践，有治外法权全错。", "211": "美行和国际行打交道要啥，多选全选才得分，注意对代理账户做尽调和执行特别措施，去总部看看，上门查空壳都不对。", "212": "欧盟二号令洗钱定义含哪三，多选全选才得分，注意明知还转换转移，还藏性质来源，还获取使用都要选，跨境限额是编的。", "213": "爱国者两目的是啥，多选全选才得分，注意加强防侦诉洗钱恐融和特别审查高危外国辖区机构交易，管制裁定标准是别人。", "214": "FATF说啥情况报可疑，多选全选才得分，注意及时报情报单位，有据涉恐融，有理由疑是犯罪所得都要选，聊过问过不算。", "215": "情报单位向别家要信息要咋做，多选全选才得分，注意讲清理由目的和尽力给完整真实，群发所有单位事后反馈不是点。", "216": "类FATF区域组织咋影响本地，多选全选才得分，注意发地区文本和搞成员互评，直接执法强令立法都不对，它没那么大权。", "217": "沃堡代理行原则哪两条，多选全选才得分，注意发起人外再拉一人批和政要加下游嵌入增风险，每年审所有只看辖区都错。", "218": "突然来一堆政要客合规要哪两手，多选全选才得分，注意加强持续监控和查清财富资金来源，高管批是所有政要都要。", "219": "巴塞尔KYC四要素考两，多选全选才得分，注意风险管理和客户接纳政策，配上身份识别和持续监控才完整，偏好准则不是。", "220": "新企业涉人口贩运哪俩红旗，多选全选才得分，注意非正常时间多笔食宿费和边境现金存即被取走，钻石虚拟币不是核心。", "221": "FATF和区域组织关系哪两句对，多选全选才得分，注意区域组织管技术援助和两者独立但同目标，成员不能兼任是错的。", "222": "区域组织更新含哪原则，多选全选才得分，注意帮成员解决技术援助和保FATF牌子，发国别互评定薄弱辖区不是这题。", "223": "代理客户不受母控谁要尽调，多选全选才得分，注意客户本身和它母公司都要查，查客户的客户查第三方服务方都偏了。", "224": "员工违反反洗钱啥风险，多选全选才得分，注意上制裁名单，罚款监禁，丢工作都要选，变政要上灰名单被开除是凑数的。", "225": "爱国者域外哪三对，多选全选才得分，注意部长能传唤有美代理户的外行，不回复能关户，能要股东身份记录都要选。", "226": "巴塞尔说信托要查哪三方，多选全选才得分，注意受托人，受益人，委托人授予人都要穿透，受访收款管理员是干扰项。", "227": "埃格蒙特要情报单位最大合作靠啥，多选全选才得分，注意非正式少前提多分享和可独立签备忘录，都经中介禁分享说反了。", "228": "廿五万警报远超年薪十万咋查，多选全选才得分，注意看交易背景，问客户经理，找客户要证明，直报丢弃看现金都错。", "229": "外行帮制裁人走钱哪两句对，多选全选才得分，注意部长能传唤有美代理户的外行记录和被扣了能异议，没同制裁不能扣是错的。", "230": "信托公司建管信托要懂哪俩，多选全选才得分，注意资金来源结构和背后一般目的，责任权力管理结构业务性质都不是。", "231": "类FATF区域机构主业是啥，多选全选才得分，注意给FATF定政策喂料和促落实建议，对不合作上措施当监管都错。", "232": "巴塞尔尽调好做法哪三，多选全选才得分，注意看偶发交易规模画像，定接纳政策盯高风险，高风险加做尽调加高管批都要选。", "233": "欧盟五号令高风险国加做尽调要哪三，多选全选才得分，注意高管批，问交易原因，查资金财富来源，护照地址税号不是这组。", "234": "互评出战略缺陷辖区要干啥，多选全选才得分，注意高调承诺速改和在强化后续下报进展，等私下声明要延期申诉都错。", "235": "亚太区域组织咋帮成员，多选全选才得分，注意鼓励地区反洗钱合作和推国际措施落地，保扣押可诉列区域清单不是。", "236": "欧盟四号令变了啥，多选全选才得分，注意赌场扩到所有赌博商和报告门槛一万五降到一万，能推断明知分罪单列不是。", "2434": "高官躲中介异国开户咋办，多选全选才得分，注意查财富资金合法，给中介做尽调，确认中介真代表他都要选，只筛开户人不够。", "2435": "没搭好反洗钱计划监管咋罚，多选全选才得分，注意延期起诉给时间改和停止令叫停，刑事罚加许可注意事项都不是。", "2436": "欧盟三号令罩哪三类，多选全选才得分，注意金融机构，赌场，房地产经纪都要守，辩护律师那条不算，别被光环骗。", "2437": "情报单位打金融犯罪角色哪三，多选全选才得分，注意公私都能用广泛调查术，手握海量信息，能跟外国同行合作都要选。", "2438": "FATF说啥能简化尽调，多选全选才得分，注意小额人寿千和两千五，无弃权不抵押养老金，雇员退休金都要选，不记名要加严。", "2440": "沃堡说空壳银行三特征，多选全选才得分，注意无固定地址经营，无雇员，无银行监管检查都要选，不受反洗钱法不是。", "2795": "终止客户关系咋做对，多选全选才得分，注意标准化流程留档，走前终审交易，留终止理由记录都要选，灵活事后通知错。", "2797": "谁永远全守OFAC，多选全选才得分，注意美国公民全球，在美注册企及海外分支，绿卡全球都要守，给美元户的不用全守。", "2798": "二零一二年FATF四十条哪两句对，多选全选才得分，注意落实安理会定向制裁和建风险为本框架，躲开高风险统一框架不对。", "2804": "埃格蒙特论坛目标哪三，多选全选才得分，注意加强情报单位合作，安全共享敏感信息，建信任环境都要选，提立法不对。", "2805": "政府情报单位职责哪三，多选全选才得分，注意分析可疑报告，向本地执法和外国同行发分析，接收报告都要选，起诉不对。", "2810": "慈善机构为啥易被恐融，多选全选才得分，注意全球跑近高风险区和有信任有大钱多现金，合法不分红收捐搞慈善是表象。", "2811": "没制裁体系国咋普法，多选全选才得分，注意办反金融犯罪制裁培训和政府双边对话促认知，断贸易加罚款执法不是提认知。", "2812": "外行给美行签认证要证哪三，多选全选才得分，注意所有权详情，实体办公地，不让空壳间接用都要选，不让政要用不对。", "2814": "反洗钱令和本地法啥关系，多选全选才得分，注意指令是框架成员须落地，本地可更严加码，本地优先完全独立必须相同错。", "2815": "巴塞尔识别接受要哪俩，多选全选才得分，注意按风险定不同尽调和识别验证客户受益人代理人，禁编号户同样做未验交易错。", "237": "审计发现消警报大缺陷，会计师纠正期干啥，别去指导补，别去写文件培训，归位是等管理层说修好了再去验证修没修成。", "238": "慈善给恐活区送衣物，啥像恐融，频繁取现金最不对。分支多，欧洲捐款多，留个非经营户都正常，钱变现金才脱监管。", "239": "政要刚被报可疑电汇，老家又爆腐败，找谁，直接报银行反洗钱专员。董事会业务线太远，FATF还没热线，专员才是上报口。", "240": "啥时重启风险评估，并购时最该重来。两年一评是常态，董事会换人，FATF出指引不直接触发，机构变大变样才必须重估。", "241": "系统长期异常反而不报警，补啥场景，上同侪比较最管用。收入场景已被高存款搞失灵，映射是找差距，基准线下是调模型。", "242": "听说新产品委员会背着合规开会，下一步先把合规塞进去。别去董事会喊停，也别等批了再研究，早期嵌入才能定控制框架。", "243": "保险交易谁最像洗钱，拿两家不同银行汇票交季保费。不同来源现金等价物凑保费是经典，高风险地买财险分支各买团险都正常。", "244": "同族裔出纳专接同乡同额现金还有午餐，咋办，先进一步调查再定。直接调岗，拉更多同乡业务，换个出纳都治标，收集事实才合规。", "245": "贩卖人口哪个交易先查，外地人来存现金当天又取光。光是移民国汇出，外地人存款还不够，存取同日加异地才是流入户铁信号。", "246": "非美行要在美行开户，爱国者要啥，要所有者身份和占比。完整客户名单，管理架构，培训细节都不对，盯的是两成五大股东。", "247": "零售行收了信用卡业务，原培训够吗，不够要按业务特有风险调。政策流程法规都讲过也不行，信用卡有自家手法必须定向补。", "248": "政府为啥搞经济制裁，为执行外交政策目标。不是单为反专制，反恐，反欺诈贸易，制裁是经济孤立逼对方改行为的工具。", "249": "收购一家机构，改名小组，简化现金流程，哪个触发重估，收购触发。改名不改风险，精简流程是操作，半年前做过也不算。", "250": "执法刚走留名片问一堆，合规先干啥，先核实他是不是真授权代表。别急着报可疑，写备忘，说已给全信息，验身份才是第一步。", "251": "外国政要保单要加受益人咋降风险，对受益人做尽调最全。定财富来源只是其中一项，拒加，拒政要当受益人都一刀切，不合规。", "252": "老客户换业务换辖区，制裁风险先干啥，先补参考数据，定筛谁筛多勤。政要负面筛，董事受益人筛，独立测试都太早，先搞清筛什么。", "253": "制裁筛查要求是啥，把客户交易拿去跟持续更新的制裁名单比。不是一上名单就关户冻结报警察，筛查加报确认命中才是正路。", "254": "光看账户加了解客户最难定啥，交易方负面媒体最难。休眠，多转同系企业，跟业务差太多都能从流水看出，外部声誉得另查。", "255": "艺术商啥事触发持续尽调，总部搬新西兰到中国又在马来开分支。换受益人，加咨询，兑外币都小事，跨境搬家加设点才是大变。", "256": "同辖区共享客户信息难在哪，卡在数据隐私法。技术不统一，消保法，反洗钱法打架都次要，跨境跨机构先看隐私让不让给。", "257": "审计谈隐私数据守哪条，反洗钱和隐私不互斥要兼顾。说隐私不如反洗钱，恐融压倒隐私，两国先扯平不平衡都错，合规要两立。", "258": "经济制裁主要想干啥，改变国家行为。从经济孤立逼改道，和外交目标同考点换皮，防资源耗，限出口，促技术竞争全是干扰。", "259": "开户只有名义控制人，地址外地，还想玩票据汇款，啥最加风险，只给名义人不给真受益人最致命。玩票据汇款地址外地可解释。", "260": "合规带队审计部看报董事会，两年一审哪错，错在不独立有利益冲突。一八到廿四月一评可以，内审不强制外部做，报董事会没错。", "261": "谁对银行保密反洗钱项目最终负责，董事会。合规管日常，高管管执行，业务经理管一线，最终拍板扛责的是董事会。", "262": "给出纳新员工讲反洗钱讲啥，讲大额现金报告程序。一线最要会报现金交易报告，风险评估结果，审计政策，支票欺诈损失都不是首课。", "263": "主席现金躲备案还报了可疑，咋跟董事会说，按既定可疑政策报不泄密。别给律师甩锅，别捅监管，别拉总裁去审主席，程序加保密是关键。", "264": "审计出报告违规政策过失，跟进本给谁，给指定董事会委员会。审计管理，人力，业务线都接不住，整改跟踪要直达董事会层面。", "265": "热线举报哪个像洗钱，让柜员用客户账户代转账。帮修信用，发传单，省汇费都正常，借他人账户过钱是电汇红旗。", "266": "在华代理不守协议还可疑，啥该断交，超了主办行风险模型标准就断。在受制裁国开分支，合规官被查，被要明细都还不到断。", "267": "反洗钱计划缺陷吃执法，董事会咋办，让合规出整改方案。开掉合规，买新系统，请律师对抗都偏了，先认错改制度才是正道。", "268": "信贷想拿可疑名单评风险，给不给，要董事会批了才能披露。直接给，直接拒，找经理商量咋给都不对，可疑保密加高管批是铁律。", "269": "国际慈善交易高风险，断交为啥，钱进出复杂难追踪。换人快，有国际汇款都正常，驻受制裁名单国也不如说不清钱路致命。", "270": "导游月存一万变十万说会多，咋办，先调查，该报就报，考虑断交。直接断，只观察，设上限都错，金额十倍加解释牵强必须深挖。", "271": "有制裁指定方时美行何时拦，只要美行参与转移就得拦。不管最终受益是美是外，也不管代理喊没喊，美行经手就要负责。", "272": "高风险地金商廿万黄金无背景，啥最红，客户不给背景和商业目的。朋友介绍，高风险地经营，新客卖金都可解释，说不清才致命。", "273": "热销产品有风险无缓释咋办，先上临时管控顶着。长期项目太慢，等年审太拖，直接停售太猛，永久方案出来前先控住。", "274": "跟经纪商分享客户信息先看啥，看隐私数据保护让不让。能不能依赖对方尽调，有无司法条约，有无账户都次要，先看能不能给。", "275": "被罚后改客户准入先干啥，先审风险评估。改培训，上加做尽调，清验证差异都太早，风险为本第一步永远是先看画像准不准。", "276": "啥情况该终止，超本机构风险胃口又不整改。金额大，在恐活国做生意都不直接断，别家模型更不算数，超自家线加不改才断。", "277": "执法让调查期别关户，合规咋报董事会，拿书面盖章授权函说话。给可疑副本，让监管转达，给高级别摘要都不够，留户必须有书面令。", "278": "家教开户哪个像洗钱，大额现金存入当天全转走。存小现金，定转亲属，活转存都正常，快进快出不留余额才是处置信号。", "279": "警报多到看不完，评估系统先看啥，按上次风险评估审参数。跟同业比，删不响的过滤器，按清警能力调参都错，参数必须跟风险走。", "280": "OFAC治外禁交易指啥，禁跟特定国组织个人做未经许可的交易。有许可的反而不禁，扯海外贸易，非美个人许可全是绕。", "281": "回外国执法为啥受限，卡在本国隐私数据保护法。司法互助，大使馆转手，对方可疑保密都不是限制，跨境给信息先过隐私关。", "282": "主管判庞氏被炒还牵出雇员，咋办，处分加报地方当局。只内部处分，不诉就不管，拉全员培训都太轻，有证据参与必须外报。", "283": "风险评估哪个缺陷最要命，几年没更新没含新产品。评太勤，换人做，没算未来风险都次要，跟不上业务变才是高风险。", "284": "甲行在美代理五百万，恐怖组织在外分支一百万，美国能没收啥，扣美代理户一百万。不是全扣五百万，也不是跨境扣外分支。", "285": "每周结伴同网点同收款人两千五，啥最提示，金额略低于记录线。结伴来，同网点，同收款都可解释，卡着线汇才是躲记录。", "286": "执法查雇员保险欺诈要空头支票报告后续，咋给，凭正式书面请求再给。报董事会，打电话问雇员，直接敞开查都错，书面加授权才放。", "287": "电汇异常评审客户活动先看啥，看近期存款记录跟钱来处。电话网银发起量，去年总量，经没经代理都次要，先问钱哪来的。", "288": "防大规模杀伤武器靠啥工具，靠经济制裁。委托书，监控令，司法互助都不是首选，冻结加禁运加旅行禁才是针对性制裁。", "289": "没自动软件咋做制裁筛，上交流网查综合名单。信用报告，关键词搜索，单拿指定名单副本都不全，综合名单才含全量。", "290": "乙行借甲美元户超预期还可疑已报可疑，下一步，留户但报高管知晓风险。报税局，要串通证据，喊别家断交易都错，报加高管盯是正解。", "291": "员工啥举动要加做尽调，总裁豪宅加俱乐部会员要董事会批。用公司资源谋私是红旗，查资料称熟悉客户，休假滞后审票都正常。", "292": "谁管合规文化日常落地，合规专员。董事会扛最终责，高管管资源，业务线管执行，天天盯制度转的是合规官。", "293": "行长疑涉案监管来查，合规先干啥，找法律顾问按指示办。销毁记录，逼辞职，通风报信全是作死，律师指导应对才是活路。", "294": "欧亚欧元付给二级制裁辖区公司啥最重要，没美国联系也有二级长臂风险。一次性，只管银行，只冻美国公司那几条全低估次级制裁。", "295": "审计独立最好咋描述，不沾反洗钱项目加向董事会或委员会报告。不沾可疑程序加向总裁汇报那两条半对，关键是脱离合规直达董事会。", "296": "内部转介疑恐融先干啥，先收背景和交易信息。直接退户，直接报可疑，直接捅董事会都太急，没事实做不出决定。", "297": "培训超基础咋定向，按角色给活，警报员可疑写手各学各的。政策流程，年度复习，历史背景都太泛，贴岗才是针对性。", "298": "法国油企跟伊朗炼厂做生意吃啥制裁，吃二级制裁。非美方跟全面制裁国交易就中招，名单制，国家制都不是这题，二级等于连坐。", "299": "电汇受益人信息不全先干啥，先要完整资料去查制裁。认受益人账号，报管理层，查资金来源都后置，先补信息才能比对名单。", "300": "执法要调查客户信息咋回，先跟指定部门定合规方案。直接打包发邮件，到处分享细节，冻账户告客户全错，专人加报高管依法给。", "301": "收到执法政府请求先干啥，先查账户活动定总体风险。先报董事会，先报可疑，先通知客户都错，第一步永远是看风险。", "302": "货币服务警报疑恐融啥该升级，客户给受制裁组织捐款。用途对得上，登记募捐，挂信托名头都正常，钱流向制裁实体才升级。", "303": "反洗钱官躺平致计划缺陷被罚个人为啥，合规官问责制背锅。不是唯一能罚的人，也不是替银行顶包，指定合规官就得扛整体责。", "304": "新人一入职就得训银行程序，别拖到一年后再补。有效培训既讲法规，也要讲本行政策程序才算达标。", "305": "明知大客户给人口贩子汇钱却不报也不退，就是装看不见。考点是‘有意忽视’，法律上等同明知故犯了。", "306": "开户一问报告制度就躲，被告知要上报就缩回去，最可疑。记住聊记录保存就想溜的，都要进一步调查。", "307": "外部因素看辖区政治变化和加不加制裁，这才影响国别风险。新客户新产品那是内部的事，别选错哦。", "308": "想看客户合不合本行行业偏好，就得摸清关系性质目的、画出风险画像。这是第五支柱持续尽调的核心要求。", "309": "反洗钱项目最后拍板的是董事会，合规官只是干活的。记住最终责任在董事会，CEO执行也不背锅。", "310": "经济制裁绕来绕去，最终图的就是保护本国国家安全。别被声誉反恐利润带跑，认准国家安全才得分。", "311": "外国银行在美代理户有赃钱，美国直接扣代理户等额资金。这就是爱国者法案319条，不用追踪原钱了。", "312": "全企业合规文化关键是信息在组织内共享，别各自为政。先看隐私法和公司政策，同一法人内享一般没事。", "313": "警察拿预制表要查前客户账户，出纳别直接给。先上报合规官，让有决定权的人定夺才合规，别自作主张。", "314": "CEO给亲戚慈善大额捐钱，助理别去对质调查。最稳是匿名走内部合规热线，还能防报复保自己哦。", "315": "收到执法调查请求还报了高管，下一步就请有经验律师。让他帮你过质询谈方案，别自己硬扛会吃亏。", "316": "给董事会报SAR别给明细名单和全文，就给统计数。报个数金额和趋势就够，细节不能往上捅了。", "317": "大量员工不懂PEP咋处理，下一步就是搞全公司培训。缺哪补哪，服务高风险客户就得专项训到位。", "318": "要防冲突升级武器扩散，最可能用资产冻结。冻住特定人资产加旅行禁令，这就是针对性制裁记住了。", "319": "上市公司和高风险国公司有往来，啥最该升级？就是伤银行声誉。首次大额都要查，但声誉风险先升级。", "320": "董事会管反洗钱，职责就是任命合格首席合规官。日常流程别让董事会管，利润导向更不是合规文化。", "321": "金融调查碰数据隐私，先想GDPR通用数据保护条例。共享前先查隐私法，同一法人内分享一般没事。", "322": "拿着客户档案和预期活动，就是要交叉验证交易。对不上画像没经济意义的，就标出来重点盯住了。", "323": "看见同事搞可疑活动，别质问也别找主管聊。直接报冲突线或合规部门，内部热线还能匿名举报哦。", "324": "OFAC域外职能就是禁交易冻资产，盯住被指认的人。禁止交易并冻结资产，别记成报洗钱那套哦。", "325": "问哪个员工行为不触发红旗，选炒股赚大钱。拿工资过奢侈生活、例外多谋私利才警惕，投资收益不算。", "326": "FATF互评估给了差评，进口客户会被连累啥？跨境汇款被加强审查变慢。别说没影响，更别说全停交易。", "327": "小老板天天存9950支票还说不清用途，就是卡线躲报告。看到天天略低于一万，直接报SAR没商量了。", "328": "改成风险为本的计划，就得靠数据说话。把业务交易内外信息全用上，认清客户产品渠道辖区风险。", "329": "最优先查的是收到跨境转账立马又转给别人。快进快出过账最危险，比小额重复兑小支票急得多。", "330": "啥时候该报SAR？就是现金故意绕开报告阈值。系统报警没清报警不等于报，绕阈值才算数记住这条。", "331": "OFAC域外影响为啥？就是实现美国外交国安目标。别记成护盟友调贸易，就是美国国家利益说了算。", "332": "慈善户收多笔电汇又往高风险国打钱，赶紧报警。这是典型借壳，平时不动突然大额国际交易就是红旗。", "333": "管不同总部的外国辖区，反洗钱按高的标准来。母国东道国谁严听谁的，搞不定就找母公司律师定。", "334": "券商新户说长投转眼清仓归零，还被执法问询。多选全选才得分，注意C执法质询和D与长投目标不符都要选。", "335": "隐私拉胯的两大法律风险是啥？多选全选才得分，注意A欺诈商业指控和B监管处罚都要选。声誉营销那是别类。", "336": "住高风险区大额现金存，又小额电汇到别的高风险区。多选全选才得分，注意C往高风险区汇和D大额存都要选。", "337": "冰淇淋小厂国外存支票加多国大额电汇，最该查。多选全选才得分，注意B往国外汇和D国外存支票都要选。", "338": "新P2P只输名字电话就跨境实时转，风险爆棚。多选三项全选才得分，注意B跨境C实时E对方信息少都要选。", "339": "啥像鱼叉钓鱼？都是熟人来信骗你。多选全选才得分，注意A假领袖B假员工改工资C假供应商改付款都要选。", "340": "银行被罚，首席合规官遭啥？多选全选才得分，注意A建议解雇B民刑诉罚款监禁E禁入金融业都要选了。", "341": "谁能干反洗钱审计？多选全选才得分，注意B懂AML内审和E近两年在AML干过的顾问都要选。外行亲属可不行。", "342": "客户身份异常培训抓哪俩？多选全选才得分，注意A姓名住址核实不了和EIP设备与注册身份对不上都要选。", "343": "执法秘密查20人洗钱网，银行专家咋办？多选全选才得分，注意D拉法务合规定级和E搜客户有无往来都要选。", "344": "员工涉洗钱红旗哪俩？多选全选才得分，注意B花超工资的奢侈生活和C该休假死不休都要选。服务久不算。", "345": "想摸全组织固有风险看哪俩？多选全选才得分，注意C在哪国展业和D卖啥产品服务都要选。监控尽调是控制。", "346": "匿名举报洗钱查啥？多选全选才得分，注意C往多高风险区电汇和D交易大但月末余额低都要选。老户豁免不顶用。", "347": "查电汇剥离看哪俩？多选全选才得分，注意A比进出银行时电文变没变和B找藏发起人的可疑短语都要选。", "348": "执法啥时能看客户财务记录？多选全选才得分，注意A上了STR被点名和B拿了法律传票传唤都要选。媒体间接不够。", "349": "餐馆新户天天近9500现金，多选全选才得分，注意A店跟银行距离远和B金额天天贴着线都要选。稳定流水不算。", "350": "美国银行何时拦OFAC交易？多选三项全选才得分，注意A针对经被禁实体B被禁人发起D有利益关联都要选。", "351": "培训去年没变就想沿用，漏了啥？多选全选才得分，注意A新趋势新风险和D别家被罚案例都要选。旧评估不讲了。", "352": "美银行给外国银行开代理户，爱国者法要哪两步？多选全选才得分，注意B判要不要强尽调和C评估洗钱风险都要选。", "353": "跨国全行AML项目看哪三？多选三项全选才得分，注意A服务啥客户C各国条例范围D产品服务风险都要选。", "354": "现金加国际电汇警报，判报不报看哪俩？多选全选才得分，注意B客户尽调档案和D事发期交易记录都要选。", "355": "腐败国客户两年财富700万到5亿，哪俩最嫌？多选全选才得分，注意B短期暴富和C是腐败国PEP家属都要选。", "356": "私行签字人合沃堡哪三？多选三项全选才得分，注意B核实签字人身份D留授权证明E搞清与持有人关系都要选。", "357": "建第三方关系前红旗哪俩？多选全选才得分，注意C要怪付款开票和D合同缺反腐条款都要选。有能力报价合理是好信号。", "358": "OFAC规管谁？多选全选才得分，注意C美银行海外子公司和D外国银行美国分行都要选。中介有美客户可不算。", "359": "代理行培训按沃堡讲哪俩？多选全选才得分，注意A恐融钱不一定是赃钱和E信息共享能打恐融都要选。责任对等是错的。", "360": "被执法查洗钱，配合多做哪俩？多选全选才得分，注意A请求回应集中管和C高管律师先审传票都要选。拒谈销毁不行。", "361": "啥时该退关系？多选全选才得分，注意B执法让关和E符合本行销户政策程序都要选。怕声誉要开户可不是理由。", "362": "识可疑最常用俩控制是啥？多选全选才得分，注意A制裁筛查和E交易监控规则都要选。负面媒体传票搜查令不算。", "363": "被FIU查，合规官干啥？多选全选才得分，注意D尽快给全信息别拖和E上报高管董事会都要选。别外传群发全员。", "364": "野生动物贩运常见哪俩？多选全选才得分，注意C养殖场和不相关公司大额电汇和D让收益付无关第三方都要选。", "365": "经济制裁常见三类？多选三项全选才得分，注意A针对性D行业性F全面性都要选。技术迅速监督那都是编的。", "366": "按巴塞尔KYC设计标准抓哪俩？多选全选才得分，注意C记好接纳政策和D对高风险户持续监控都要选。审计报疑是另环。", "2442": "审计发现问题咋应对？拿结果去识别评估洗钱风险。关户写建议那是别人的活，核心是用发现补风险。", "2443": "谁来独立测试反洗钱制度？得是直接向董事会汇报的人。专家前同事退休官员再牛，不向董事会就不独立。", "2444": "董事会咋证明重视合规？就是定下书面政策讲清原则。自上而下都要守，光监督通报可不算承诺哦。", "2445": "董事是大股东的公司触发STR还解释不清，咋办？在董事会报告里详写这案。别拦报，也别私下找董事问。", "2446": "老户突然大额存，说卖房还有证明，咋办？先记录不报STR的理由。有解释加证据，就留痕说明为啥不报。", "2447": "所有反洗钱制度必备啥？就是有个合格合规官管事。监测系统面授培训EDD再好，没合规官也转不动。", "2448": "监管正查客户，合规官咋沟通？按当地适用法律跟监管执法谈。别只走董事会，也别只给点名那点信息。", "2449": "制裁筛查要求干啥？拿客户交易去比政府更新的制裁清单。不是一上榜就关户冻结，得先比对筛查预防。", "2450": "守制裁最后一步是冻住指定人资金资产，还要经董事会批。自动筛查调风险都是过程，冻结才是动作。", "2451": "合规想融进文化靠啥？靠持续培训不断强化。审计审查留记录都是监督，培训才能让合规变习惯记住。", "2452": "离岸四合伙一人拿授权书急开户存大钱，第一步先验所有人身份。来源申报STR都靠后，先把人认全了。", "2453": "报完高价值客户可疑交易，咋配合当局？人家要啥支持文件给啥。别暗示客户来解释，更别等诉讼才给。", "2454": "警报查实可疑，报STR前先干啥？先把文件和决定依据保好。找别家核实补档问客户都是后话，留证先行。", "2455": "社区银行国际电汇猛增，专家第一件事做风险评估。先摸清这波电汇啥背景，再定报不报关不关户。", "2456": "沉寂户突存大现金当天转离岸，还拐到慈善户，最该报STR。禁交易强尽调列名单都是后招，先上报要紧。", "2457": "搞新员工筛查，反洗钱官找谁协调？找人力资源。他们管招聘入职有信息，审计FIU监管都不管招人。", "2458": "老柜员经手可疑不报内报，查出女儿重病缺钱，咋建议？指示她补交STR。别急停职重训，先把该报的报了。", "2489": "给授权人看SAR文件前，先独立核实请求者。别先找FIU批找律师，更不能撤传票，验明身份权限最优先。", "2875": "给高管看AML控制行不行，别数警报和高风险新增数。看真警报和误报比例，比例健康才说明系统准。", "2876": "FATF十一项即时成果含哪三？多选三项全选才得分，注意A国际合作给情报B监管盯住机构计划E洗钱被查被诉都要选。", "2877": "AML部门想把信息分享给别部门，先查隐私法和公司政策。风险评估手册合规政策都不是卡子，隐私限制才是。", "2878": "要审计独立，审计的人得不碰合规计划，还向董事会汇报。沾了合规或向CEO汇报，独立性就没了。", "2879": "SAR啥时候报？听当地法规的时间要求。别硬记30天，也别按复杂度和领导感觉走，法规咋定咋报了。", "2880": "银行吃了整改令，高管员工担啥责？明知违规不改，合规官高管都背个人责。不是只罚一人，更不只民事。", "2881": "啥变化要重估固有风险？多选三项全选才得分，注意A推新品B风控合规大重组E搞并购都要选。换经理换技术先不算。", "2882": "写整改计划对付审计发现，别图快图省钱。得花几个月挖掉根本原因，三个月交差不投钱糊弄不过去。", "2883": "荷兰银行收意大利行要信息，都是欧盟的，先咋办？只给必要合理适当的信息，还得符合法律法规才行。", "2884": "带投资还能付给未知第三方的寿险，合规就该不批。未知第三方洗钱风险太高，KYC做了抢上市也不行。", "2885": "拿到一堆审计发现，正确回应是挖根因再补救。从源头解决问题，别重测一遍，更别让审计队去执行。", "2886": "上次被查出毛病改了不少，还有啥对？多选全选才得分，注意C仍可能被要求再整改和D拿不出改进会被罚都要选。", "2887": "高风险户上季度没按计划审KYC，经理咋办？先查流程为啥漏审再纠正。别直接报SAR除名冻账户，找病根要紧。", "3254": "预付卡都推出去才问合规，合规该说啥？下次开发中就做风险评估。开发后评估找法务写报告都晚了。", "2459": "券商新户口口声声长投，当月就清仓归零还惊动执法。多选全选才得分，注意C被执法问询和D与长投目标不符都要选。", "2460": "建制度防洗钱恐融考虑哪俩？多选全选才得分，注意B手法为遮资金性质和D用类似方式转钱都要选。钱脏不脏不是抓手。", "2461": "会计师看潜在客户哪俩该上报？多选全选才得分，注意A生意讲不清还不懂行和E拿不出受益人信息都要选。", "2463": "谁至少要特定角色AML培训？多选三项全选才得分，注意A合规员E一线客户员工F董事会都要选。顾问IT人事按需定。", "2464": "啥导致重估AML计划？多选全选才得分，注意D上新产品和E扩新地区都要选。换CFO改名换审计员不用动计划。", "367": "听见同事教人躲SAR，员工咋办？别报警也别私聊。直接报合规主管，串通瞒报就得往高管上报记住。", "368": "汽修厂收避税天堂大电汇没商业理由，还报了STR。别看店主热心慈善，按程序报给银行反洗钱专员。", "369": "执法电话问正查的客户，员工别确认也不直接给。先要正式信函验真假，执法只能要已报STR基本信息。", "370": "想退户执法书面让留户监测，关键看啥？看你还守不守得住监管义务。费用报了几份老记录都不是决定项。", "371": "移民小额存冲突邻国ATM取，银行先干啥？先发起调查。过渡账户小存快取很像拆分，证据不足别急报STR。", "372": "兑换所多人同金额但更频繁，咋应对？先进一步调查定性。别直接报STR赶客，也别打电话问为啥汇得多。", "373": "执法看完STR要补充材料，还能要啥？要开户文件和账户报表。这是办STR调查用的基本信息，别给多了。", "374": "给执法交STR支持文件，先验对方身份。确认是FinCEN或适格执法监管代表再给，留档五年备查才稳。", "375": "小烘焙店啥像洗钱？就是到处开多户。店小不需要那么多户，户多就为倒钱，每日现金买保险不算记住。", "376": "收到冻资产法律请求，立马冻结别通知客户。先拿指令副本全力执行，等法务批完黄花菜都凉了记住。", "377": "执法要求又宽又不当，咋回？快速回应同时谈缩小范围。不能拖不能不理，实在不行法庭上异议也行。", "378": "回执法要求最好配审计跟踪系统，管要啥给了啥。经高管律师审集中管留痕，特权文件冻账户别乱来。", "379": "啥要做EDD？公司拿不记名股票就得做。谁拿着算谁的藏真老板，搬店新开业低风险不变都不用。", "380": "被执法查，咋回应？所有请求完整及时处理。别跟分析员碎嘴，也别无视拖延，宽了可谈但不能不回记住。", "381": "政府让关了的户继续开着防风险，得拿啥？拿带正式抬头经授权的书面请求。口头邮件冻钱令都不算。", "382": "FIU核心活是啥？收分析转。收可疑报告研判后再发执法和外国FIU，定标准抓人执法那是别人家的事。", "383": "小银行查接纳政策，尽调咋做？持续做还得匹配风险。高风险多看低风险少看，一次性年审只看高风险都不对。", "384": "岗位描述缺反洗钱职责咋改？全员岗位说明都加上。从合规到业务人人有责，发邮件年训提一句可不够。", "385": "嫌疑人访谈开始说假话咋办？别挑明也别终止。装没听出来继续挖实质问题，不露声色再绕回去套实话。", "386": "老头退休金一千五却周存三千周兑八千五，节奏大变。STR就写存取时间和金额变化，饼干住了廿五年都是背景。", "387": "执法电话要上月STR信息，调查员咋回？先报银行合规专员。别直接电话给，也别要搜查令，让专人按程序回。", "388": "二手车商收贝宁多笔等额五万共百万，最可疑是金额又大又整齐。配上单据对不上汇款，整数等额就是贸易味。", "389": "泳池公司开十九户人手一卡买药，银行咋内查？直接访技术员和化学供应商。征信执法报告上网搜都不如当面核。", "390": "新名单谁要EDD？筹款组织要。慈善前台募资风险高，医院福利信托诊所合伙可没这标签，记住这区分。", "391": "跨国查国外业务为啥费劲？当地隐私数据法挡着不让分享。语言时差总部令都不是硬伤，跨境先看法律。", "392": "啥地方约嫌疑人谈最有效？执法办公室采访室。家办公室咖啡馆都易失控，单独统一地点才压得住场。", "393": "新产品赚钱但AML被查大毛病，领导先补啥？先补反洗钱政策。政策是地基，没它培训评估招人都白搭。", "394": "天津朝鲜烟草大额美元急汇，制裁组先干啥？先冻结再调查。名含朝鲜但地在中国，别直接放也别直接毙。", "395": "汇款所几人同金额但更频，咋办？先进一步调查再定报不报。有警报不等于直接报STR，先权衡正反因素。", "396": "按揭部门漏做制裁筛查，本地经理先干啥？立刻上报高级管理层。补筛是后话，先让该负责的人知道再补救。", "397": "中风险户新增外国PEP签字人，下一步干啥？直接升成高风险。外国PEP永远高风险，别只调签字人磨蹭。", "398": "怀疑员工骗按揭，先干啥？先收集分析该员工信息调查。没查实就报警起诉报SAR，那是乱来要担责。", "399": "执法给FI好几个请求，哪个合法得回？拿法院令冻账户那个。扣特权文件无票要文件口头留户都不合法。", "400": "国与国刑事互助正式协议叫啥？叫司法互助条约。靠它传可用证据，信息交流贩人协议和平协议都不对。", "401": "初次SAR后持续审查期多久？九十天。别和一百二十天报告期搞混，九十天一审，一百二十天内交持续SAR。", "402": "同辖区内共享客户记录先看啥？看机构信息共享实践允不允许。同法域监管一般不挡，先看自家规矩隐私限制。", "403": "贵金属商新户啥要转调查？付款说明冒出未知公司。正常钻石渠道老外付款小额POS都不算，藏信息才算。", "404": "大量发邮件骗身份信息叫啥？叫批量网络钓鱼。广撒网等小部分上钩，针对熟人的才是鱼叉，短信语音另算。", "405": "执法查潜在洗钱，期间用啥？用资金流追踪。从来源或去向串出整条链，FIU证据识别流程报警系统都是辅助。", "406": "啥情况可不做EDD？高风险国欧美行分支子公司还守集团政策的。复杂结构赌场PEP都得加码，唯独这个可豁免。", "407": "大电汇进来秒变现金取出，先查啥？先查客户资料。拿预期和实际一比，对不上再深挖，公开负面流水往后放。", "408": "假冒客户邮件骗员工转钱到海外，算啥网罪？算欺骗。伪装地址人名网址骗信任转钱，群发那是钓鱼定制才鱼叉。", "409": "员工啥异常要加查？就是攒了假还死不休。披露受益人也交易生活节俭偶发例外都不算，躲休假才经典。", "410": "FIU负责干啥？及时把案子散给执法。回监管问跨国享证据收确认报告都不精准，收分析传才是本职。", "411": "保调查支持文件关键一步是啥？把触发警报的交易记录留好。传方法调阈值给客户看都不对，留痕存五年才稳。", "412": "会计所运营户啥触发全面查？国际汇款远超平时收费。大额加跨境加偏离模式三合一，捐慈善多客付款都不算。", "413": "跨境查可疑找谁合作？找金融情报机构。收分析传再分发境内外执法，欧盟FATF沃堡定标准不办案。", "414": "国家FIU三职能是啥？接收分析传播。收STR研判再发执法和外国FIU，汇编调查培训都记错了别选。", "415": "FI调查主要目标是啥？跟踪资金流动。看钱经银行券商MSB赌场咋转，更新政策存档认客户都是顺带。", "416": "高风险EDD多收啥？收管账户人的详细信息。签字担保人都得扒，婚姻旅行推荐信不顶用别选记住。", "417": "司法互助第一步是啥？请求国中央机关给另一国发委托书。写清要啥啥罪啥法，再转当地查证据移交。", "418": "哪个国家机关分析评估信息定洗钱恐融？就是金融情报机构。FATF巴塞尔沃堡都是定标准搞合作的。", "419": "为啥做AML风险评估？给高风险产品服务客户地域配控制。凑数应付批风险偏好都不对，配控制才是目的。", "420": "同规格商品十二月涨两成五，分析师先干啥？先写报告看涨价合不合理。通胀成本都可能，别上来就报STR。", "421": "PEP大整数一次性电汇给未知组织，哪项不是报由？维护声誉不是。受益未知金额大活动怪都是，声誉是后果。", "2377": "账户名跟政府登记的文件对不上号，这是网上偷身份的典型路数。FinCEN说了，这种拼写不一致就是网络欺诈的新信号。", "2378": "PEP换老板变高风险国都只是加码审查，不至于分手。只有客户死活不肯更新资料，那就只能退出关系。", "2465": "农产品出口一直正常，突然拿旅行支票要去不合作国家，反常的就是这步。钱要往黑名单辖区跑，才是报STR的理由。", "2466": "报完可疑千万别通知客户，也别急着关户冻钱，那会打草惊蛇。最稳的是先把所有单据证据锁好，留给后面调查。", "2467": "加油站三个月流水翻倍，查三个月和一年都没解释，说明看得太窄。直接拉出从开户到现在的全部流水，才能看出套路。", "2468": "老师年入四万五，钻石商却几百万一笔转完秒飞香港，完全对不上人设。钱和身份差太远，直接找主管部门和警察接手。", "2469": "给每个新客户都上EDD，看似勤快实则浪费力气。记住顾问那句，EDD必须按风险来，高风险才加码，这叫基于风险。", "2470": "只验身份不看交易，等于开门不巡逻，迟早出事。银行缺的是持续监控那块，赶紧改流程把客户活动盯起来。", "2471": "审计说不合规，别急着改文件，也别光口头答应。要拿出带时间表的整改计划，写清谁干啥何时干完，这才算数。", "2472": "STR里牵扯自家员工，最怕捂着不报。关键不是用啥表格，而是赶紧捅到董事会，让上面能出手管住内鬼。", "2473": "别家银行来的现金低于报告线，还跟历史对不上，已经很怪了。如果钞票还是连号的，基本就是一捆黑钱，直接报STR。", "2474": "分行STR突然变少，别急着列观察名单拖到下季度。先去翻异常报告，看是真没事还是客户行为变了没被发现。", "2475": "内部调查日志不是拿来培训，也不是拿来监测的。它就是个台账，盯着每条异常查到哪了，别让案子烂尾。", "2476": "执法要得太多太宽，别硬扛也别装死拖着。最聪明的是快速回应，顺势把范围砍小，只给真正相关必要的那部分。", "2477": "来人是外国高官的亲兄弟，光这层关系就够红了。还没证据报STR，先上加强尽职，把背景和钱路查透再说。", "2478": "新人没培训漏报大额交易，别急着开除或停工。先把上次检查到现在的所有现金交易拉出来审计，看窟窿到底多大。", "2479": "收到传票别慌着报SAR，也别关户通知客户。正确姿势是先审交易，再完整回传票，审查先行回应要对得上。", "2480": "大陪审团传票来了，别自己复印原件交出去，更别通知客户。先让自家法律顾问看一遍，合规应对才不踩雷。", "2481": "评估师不在名单上，房价还虚高一截，猫腻可能在承销商那。先查他有没有验过评估师执照，这是最关键的第一步。", "2486": "老客户当上PEP了，别拖到下个周期再说。立刻加强尽职刷新KYC档案，身份一变风险等级就得跟着往上调。", "2687": "报完STR还留着账户，就别心疼管理费和关户损失了。最高优先级是掂量这户会给机构带来多大风险，好提前设防。", "2914": "要跨境拿证据去法院用，最管用的是两国司法互助条约。埃格蒙特只换情报，国际刑警不管这摊，打电话更没效力。", "2918": "营销公司存取款买门票都正常，反常的是满城分行往同一户存钱。这就是分散存入躲监管的味，看到就警惕。", "2920": "守制裁别搞花活，最靠谱的是上自动筛查把黑名单揪出来。变高风险继续做，给制裁对象做EDD，等董事会才冻结，全错。", "2923": "警报拿不准是升级还是误杀，别去测阈值，别惊动对手行，更别先冻户。找最懂客户的客户经理问一句，信息最实在。", "2928": "被下同意令要整改，别以为是合规官或CEO背锅。最终拍板担责的是董事会，多选全选才得分，注意董事会这个要选。", "2930": "说你反洗钱差到可能吊销牌照的，只能是管牌照的AML监管机构。自律组织没这牙口，警察只管抓人，FATF不管单家机构。", "2931": "查可疑别一上来就问FIU，也别先翻外网八卦。第一步永远是先扒自家内部，客户资料流水金额量级，先把内部拼全。", "2934": "破产股东PEP违建都够不上分手，顶多加强看看。真跟黑社会沾边，金融犯罪风险爆表，才值得考虑直接终止关系。", "422": "跨国查洗钱就靠两招，自家执法能拿到金融信息，还能组外国联合调查组。啥都共享和不能加速都是坑，多选全选才得分，注意A和C都要选。", "423": "FIU干啥就是收上来分析完再分出去，给执法和外国同行递料。管人事架构断官司都不归它，多选全选才得分，注意C和D都要选。", "424": "FATF说记录至少存五年，还得随时能拿出来。存七年非传票不给都是编的，多选全选才得分，注意A和C都要选。", "426": "MLAT就是两国联手打犯罪，到国外拿证据的法律通道。说不能传证据不能拿银行记录没约束力全错，多选全选才得分，注意A和D和F都要选。", "427": "开户时啥会回头查老关系，高风险地来的汇款加不利新闻。假阳性常规查流水收入少了都不算，多选全选才得分，注意A和E都要选。", "428": "拿着搜查令进门，先要复印件记下谁来的哪个单位。让人随便翻急着套话都不对，多选全选才得分，注意C和D都要选。", "429": "跨境帮忙查，信息得保密防泄露，还得有机制让调查员能拿到能分享。找国际刑警要料各自为战都错，多选全选才得分，注意B和C都要选。", "430": "警察来要客户资料，别急着关户别立马报STR。先盯着看有没有可疑，再评估这户的洗钱风险，多选全选才得分，注意C和D都要选。", "431": "啥会触发调查，员工内线警察上门系统报警。OFAC冻结民事传票睡着的账户都不算典型，多选全选才得分，注意C和D和E都要选。", "432": "查客户洗钱就靠交易监控加负面新闻筛查。举报热线行为准则是管员工的，别选偏了，多选全选才得分，注意C和D都要选。", "434": "MSB里啥要细查，一天跑多家店往境外汇，小额汇票反复买还卡着三千线。一次大额正常汇家用都不算，多选全选才得分，注意A和E都要选。", "435": "查钱骡就三招，拿说法跟流水对，看是不是同人同机操控，数钱进出频率。直接报警报STR不是技术活，多选全选才得分，注意A和B和E都要选。", "436": "警察让留着账户钓鱼，记得要书面盖章写清留多久，材料至少存五年。通知客户冻钱顺手报STR都违规，多选全选才得分，注意B和D和E都要选。", "437": "警察要文件就两条正路，拿传票要复印件，找FIU要STR副本。给复印费搜查令硬抢都不对，多选全选才得分，注意A和C都要选。", "438": "检察官让冻产，银行就认法院令保宣誓书在手，冻住不让动。通知别家扩大冻家属，不难就不冻全错，多选全选才得分，注意C和E和F都要选。", "439": "啥时候重估风险，上新产品新客群，合并收购大变动。换董事招新人开同城网点还不至于，多选全选才得分，注意A和D都要选。", "440": "认风险就看三件套里的客户和产品，客户构成加产品供应。财务好不好企业文化监管环境都不是直接因子，多选全选才得分，注意A和C都要选。", "2483": "懂你的代理行，看管理牌照业务，看母国监管成色，看有没有真实存在。电脑好不好使跟洗钱没关系，多选全选才得分，注意A和C和D都要选。", "2484": "离岸行要开代理户，巴塞尔说先验真身在注册国有无，再看监管和反洗钱法够不够硬。上门见所有人要名单都多余，多选全选才得分，注意B和C都要选。", "2485": "PEP大客户要摸底，查钱哪来的，揪出关联人公司，连政治底细都扒透。巴塞尔有没有名单不重要，多选全选才得分，注意B和C和D都要选。", "2487": "有恐组前科的人，大额现金进完ATM取空，老做跟职业不符的现金交易，这两笔最该升级。工资房租捐慈善都不算，多选全选才得分，注意B和C都要选。", "2488": "律师费高得离谱，还没这块经验就敢接，八成是洗钱掮客。加班干两天不记笔记都说明不了啥，多选全选才得分，注意A和C都要选。", "2915": "挑监控系统就看两点，跟自家规模风险配不配，能不能做趋势分析抓异常。供应商内控跟别家一样不一样都是虚的，多选全选才得分，注意A和D都要选。", "2916": "招私行经理防内鬼，别信熟人推荐和漂亮简历。看过去雇主评价，上网搜黑料，查犯罪记录才实在，多选全选才得分，注意A和D和E都要选。", "2917": "港企汇纽约个人还报警，先别打电话惊动客户。查制裁名单，要发票合同验目的，搜负面新闻三件套，多选全选才得分，注意B和C和D都要选。", "2919": "管监控系统的队伍，别老想着撤SAR，也别去管KYC档案新不新。就干两事，配合法务盯传票户，定期调场景防新套路，多选全选才得分，注意B和D都要选。", "2921": "新公司开户看啥，做啥生意的，有权管钱的是谁，在哪国混。查所有员工查以前在哪开过户都是瞎忙，多选全选才得分，注意A和D和E都要选。", "2922": "啥像恐融，网上查无此人的NPO收钱，没来由往高风险地打小钱。众筹写清用途难民慈善拆分避税都不像，多选全选才得分，注意A和C都要选。", "2924": "MSB里最红的信号，汇钱却支吾不给收款人信息，一人捏着好几个不同名的户。低于门槛换汇小店存现金寄家用都正常，多选全选才得分，注意D和E都要选。", "2925": "马德里找纽约要资料还撞上SAR，先看隐私法和自家规矩能给啥，再坚持最小必要只给该知道的人。找FinCEN批找本国批都多余，多选全选才得分，注意A和B都要选。", "2926": "想把KYC做结实，就问开户为啥来，拿靠谱文件验真身。锁人家俩月网银问为啥选我们家都没用，多选全选才得分，注意B和C都要选。", "2927": "听说被查就跑路的财务，之前多半露馅了，问上家为啥走就含糊，花钱远超工资。老家是哪的朋友干啥的定不了罪，多选全选才得分，注意A和D都要选。", "2929": "查异常别只盯金额，也别只信机器。拿外部行情新闻对一对，找客户经理聊两句，按风险排优先级才靠谱，多选全选才得分，注意B和C和D都要选。", "2932": "一堆企业缠在一起查，先扒股东谁说了算，再问客户经理这交易为啥怪。一上来找警察直接拉黑网上私信都要不得，多选全选才得分，注意A和C都要选。", "2933": "啥人要EDD，高风险国银行来建代理，当上大使的，总理跨境开户。二十五年前的秘书本地小球员都不够格，多选全选才得分，注意C和D和E都要选。", "2935": "欧盟资管反洗钱就两板斧，搜负面新闻，问清钱和资产哪来的。拒绝所有PEP请来喝茶写财务报告都不对，多选全选才得分，注意A和D都要选。", "2983": "现金买限量表还要手写收据，钱看不清单据难追就是问题。刷卡买古董要认证钻石都正常，现金加手写才是信号。", "2985": "警报多不代表管得好，关几个户也说明不了啥。看真警报和误报的比例，准了才叫有效，这才是给高管看的硬指标。", "2986": "欧盟和FATF都爱谈数据共享，为的是让钱更透明体系更干净。不是让FIU去罚款，也不是帮银行做数据分析那套。", "2988": "跨境打官司要证据，还是认两国司法互助条约，最有法律效力。情报网刑警网私下打招呼都拿不到法庭可用的东西。", "2990": "FATF点名要盯紧加强监测的名单，行话叫灰名单。红黄通报是国际刑警抓人的，白名单是没事的，考试别混了。", "2991": "供应商本身私营股权散都不致命，致命的是货和服务给了制裁地的最终用户。看最终用户在不在制裁圈，这才是风险。", "2992": "爱国者法案玩没收加长臂，认准三一九A，能扣美国代理账户里的钱。三一四是信息共享，三一九B没这功能，别记串了。", "2993": "FATF四十条的核心就四个字，风险为本。解释说明是公开的，会随新技术更新，十一项成果是评体系好坏的，不是罚高风险国的。", "2995": "AML部门想把客户信息分给别部门，先看隐私法和自家数据政策让不让。风险评级员工手册合规政策都不是第一道关。", "2996": "小营销公司多家分行往同一户存钱最怪，像在拆着存躲眼睛。正常存取本地小企业往来买会务票都是本分生意。", "2998": "审计要独立，就得不掺合AML干活，直接跟董事会汇报。掺合了合规跟CEO汇报，都叫既当裁判又当队员，独立性就没了。", "3000": "赌场洗钱最狠的不是豪赌，而是私企借一堆赌客的户分钱进出。钱和玩对不上，就是拿赌场当通道。", "3001": "律师信托户收高风险国不明汇款，秒转低风险国熟人，典型的过账。收保险公司钱走房产买卖流程的都正常。", "3002": "拿到传票就报SAR关户调分都太急。先把交易翻一遍，再把传票回完整，审查加回应才是标准动作，别自作主张。", "3003": "SAR啥时交，别信三十天，别看案子难不难，别问领导感觉。只认本地法规写几天，法规才是硬期限，照着交才不违规。", "3005": "做制裁就靠自动筛查把指定对象扫出来。调成高风险继续做，给黑名单做EDD，等董事会批再冻，全踩坑。", "3006": "美国法长臂最准的是OFAC，海外机构也可能中招。BSA旅行规则反洗钱法管全球美元三一九B能扣钱都是错的，认准D。", "3008": "企业风险评估别抄第三方模板，也别只看新客和产品。沃尔夫斯堡说的是高风险客户产品地区全覆盖，配上真能降风险的控制。", "3010": "银行挨了整改令，不是谁都自动坐牢。关键是明知违规还不动手，合规官和高管都要背个人责任，这才是考点。", "3014": "外国PEP要降风险，别指望买数据库调高阈值找监管批。实招是摸清钱和财富哪来的，还得定期更新，盯紧来源才算数。", "3015": "两国之间有法律效力的跨境共享文件叫MLAT。备忘录谅解备忘录都没牙，考试看到法律文件就选互助条约。", "3016": "制裁不是秀肌肉，不是搞援助，也不是维稳。目的就一个，让威胁利益坏规矩的国家或团伙改行为，这才是制裁的本意。", "3018": "联合国制裁最牛的是人多劲大，各国都赶紧通过，执行还给力。快不快清不清楚不重要，多边加有力才是特点。", "3019": "警报分不清去留，别测系统，别问对手行，别冻账户。找客户经理打听客户底细，才是又快又准的一步。", "3020": "想扣外国银行在美代理户的钱，还是三一九条款的甲项。三一九乙和三一四那些都是障眼法，数字记混就丢分，认准这条。", "3021": "FIU想去国外拿料定能不能起诉，别被主权和隐私吓住。认准埃格蒙特成员之间互相要协助，这才是合法通道。", "3024": "审计挑出毛病写整改，别找FIU攀比，别只挑三个月能干完的，别心疼钱。花几个月把病根挖掉，才是最佳做法。", "3026": "三道防线里的审计要硬气，就得直接跟董事会审计委员会汇报。定多久审一次参不参与干活给不给意见都是次要的。", "3028": "荷兰给意大利传欧盟内部信息，别拿保密当挡箭牌，也别说反恐大过隐私。只给必要合理的那点，还得样样合法。", "3030": "资本市场洗钱看啥，低价股突然被爆买拉涨最妖。一路下跌基金热门重仓新兴市场都可能是正常操作，别误判。", "3032": "进了灰名单不等于被踢出金融圈，不用交罚款，不用马上去重评。意思就一个，我认账，我马上改互评挑出的毛病。", "3035": "FIU的老本行就是收单据做分析再分发，当国家情报中心。起诉搞研发给私营实时喂料都不归它，记住收和分析才是核心。", "3039": "同意令压下来整改，最终背锅的还是董事会。运营官干活合规官执行总裁落实，都不是最终责任人，拍板担责只能是它。", "3042": "存款机构里洗钱味最浓的，是客户突然狂要大面额现钞，想藏来源。数字产品火结算快有编号日志都是正常或合规的。", "3043": "带投资还能往未知第三方打钱的人寿险，洗钱风险爆表，直接毙掉。别拿KYC做完说事，也别为了抢上市先批后审。", "3044": "审计报告一堆问题，别重测一遍，别甩给董事会，别让审计队自己改。挖出病根再定补救，这步最值钱。", "3045": "谈AML隐私就记一条，FIU拿了SAR数据要记清为啥共享能给谁看。客户要删数据说啥都不能共享不经同意不能报，全错。", "3047": "能说你差到要吊销牌照的，只有反洗钱监管机构。自律组织警察和工作组都没这权限，看到吊销就找监管，这题就认它。", "3049": "欧盟六指令别跟五指令搞混，考的是受益所有权登记数据要更准。扩到众筹球队取消评估建中央监管都是错的。", "3050": "四道防线里专给董事会吃定心丸的只有第三道审计。一二道都在一线干活，哪来的第四道，别被唬住。", "3051": "巴塞尔说董事会要搭合规架子，批政策管风险。只跟总裁汇报不让见董事会不参与定政策，全是反的，记清董事会才说了算。", "3052": "动手查可疑第一步，先把自家内部材料攒齐，客户说的系统跑的金额量级。问FIU比行为翻外网都是后话。", "3056": "网上赌钱还组团演戏把钱输过去洗白，这叫筹码倾倒。隐匿协同投注玩家转账都没点到合谋输钱这个核。", "3059": "高风险户一季度没审KYC，别急着报SAR摘牌子冻账户。先查流程为啥掉链子，补上纠正措施才是经理该干的。", "3061": "情报单位之间传可疑报告走啥，认准埃格蒙特安全网。司法条约是帮忙打官司，刑警库是抓人，制裁名单更不搭边，安全共享走这条。", "3065": "没风险还一赚一亏对倒铜金油气期货，就是左手倒右手送钱。这叫洗售交易，空头反转价差都是来凑数的。", "3066": "沃尔夫斯堡私行原则就一句话，钱不清人不明就不收。管声誉护隐私教人搞PEP帮保密地合作都是跑偏。", "3067": "三一九A就是美国能伸手扣在美代理户里的钱，金额对等。一二零小时交记录财政部特别措施外国代理户尽调都是别的条款。", "3068": "风险为本的好处是灵活省力，好钢用在刀刃上。更快更被接受更能定剩余风险都是硬套的，记住灵活配资源才是对的。", "3069": "谁要听OFAC的，美国人全球都得听，美企加海外分号也得听，人在美国境内的也得听。记住A最全，双重国籍在境外都跑不掉。", "3070": "筛客户筛到跟黑社会有关系，基本就得考虑分手了。破产股东政治人物违建都还能谈，只有这条最致命，看到就准备终止吧。", "2984": "招私行客户经理查底细，靠前雇主公开搜犯罪库三样。熟人夸简历吹都别信，多选全选才得分，注意A和D和E都要选。", "2987": "FATF十一成果考啥，国际能递刀子，监管能管住机构，洗钱能被诉。给FATF送情报判了不让开户都不对，多选全选才得分，注意A和B和E都要选。", "2989": "挑监控系统就看两点，跟自家规模风险配不配，能不能做趋势分析抓异常。供应商内控跟别家一样不一样都是虚的，多选全选才得分，注意A和D都要选。", "2994": "港企汇纽约个人还报警，先别打电话惊动客户。查制裁名单，要发票合同验目的，搜负面新闻三件套，多选全选才得分，注意B和C和D都要选。", "2997": "关户有三步，流程要标准留痕，走前把账查清，理由沟通全存档。灵活变通走完才通知都是坑，多选全选才得分，注意B和C和D都要选。", "2999": "会计想发现客户变道，就盯公司实体啥样，要办的服务啥主题。干多久是不是短客都看不出门道，多选全选才得分，注意B和C都要选。", "3004": "管监控系统的队伍，别老想着撤SAR，也别去管KYC档案新不新。就干两事，配合法务盯传票户，定期调场景防新套路，多选全选才得分，注意B和D都要选。", "3007": "谁必须全听OFAC，美国公民，美企加海外枝，绿卡全球走。美元户卖美货的可不一定全听，多选全选才得分，注意A和D和E都要选。", "3009": "新公司开户看啥，做啥生意的，有权管钱的是谁，在哪国混。查所有员工查以前在哪开过户都是瞎忙，多选全选才得分，注意A和D和E都要选。", "3011": "FATF四十条认两条，按联合国决议搞定向制裁，搭风险为本的架子。躲开高风险客统一各国架子透明UBO都不是一二年原话，多选全选才得分，注意B和C都要选。", "3012": "啥像恐融，网上查无此人的NPO收钱，没来由往高风险地打小钱。众筹写清用途难民慈善拆分避税都不像，多选全选才得分，注意A和C都要选。", "3013": "啥时重估固有风险，上新品，合规大重组，并购。换个卖货头头换个新技术卖老品还不至于，多选全选才得分，注意A和B和E都要选。", "3017": "啥公司最能藏，代持董事股东，不记名股票，保密天堂私投。避税无业务私设LLC还不够典型，多选全选才得分，注意A和C和E都要选。", "3022": "风险偏好声明干啥，定量加定性划红线防越界，定好容忍度对齐战略。给董事会递报告只定性按剩余风险定都偏了，多选全选才得分，注意C和D都要选。", "3023": "欧盟隐私咋限金融机构，少收点叫数据最小化，玩AI要守严规。找第三方补料查完告诉客户全错，多选全选才得分，注意B和D都要选。", "3025": "MSB里最红的信号，汇钱却支吾不给收款人信息，一人捏着好几个不同名的户。低于门槛换汇小店存现金寄家用都正常，多选全选才得分，注意D和E都要选。", "3027": "AML里少碰个人数据咋办，只收监控必需的，常翻政策保合规。敞开给各部门拿旧数据再用都违规，多选全选才得分，注意B和C都要选。", "3029": "马德里找纽约要资料还撞上SAR，先看隐私法和自家规矩能给啥，再坚持最小必要只给该知道的人。找FinCEN批找本国批都多余，多选全选才得分，注意A和B都要选。", "3031": "想把KYC做结实，就问开户为啥来，拿靠谱文件验真身。锁人家俩月网银问为啥选我们家都没用，多选全选才得分，注意B和C都要选。", "3033": "啥像现代奴役贩人，狂打广告费，第三方过钱还没付款人信息。玩虚拟币给外籍工发现金都说明不了，多选全选才得分，注意B和C都要选。", "3034": "公证人看啥，离岸公司接盘拍卖货，还贱卖不解释。这两条最实，高风险代理人异国授权书单拎都不够，多选全选才得分，注意C和D都要选。", "3036": "文化物品恐融洗钱三件套，免税区存艺术品，找第三方顾问挡枪，社媒卖天价单件。公允价买请专家验真都正常，多选全选才得分，注意A和C和D都要选。", "3037": "埃格蒙特图啥，让FIU更抱团，安全传敏感料，互信好办事。签备忘录搞个案提立法都不归它，多选全选才得分，注意A和C和E都要选。", "3038": "听说被查就跑路的财务，之前多半露馅了，问上家为啥走就含糊，花钱远超工资。老家是哪的朋友干啥的定不了罪，多选全选才得分，注意A和D都要选。", "3040": "查异常别只盯金额，也别只信机器。拿外部行情新闻对一对，找客户经理聊两句，按风险排优先级才靠谱，多选全选才得分，注意B和C和D都要选。", "3041": "FIU职责三件，收报告，做分析，往本地警察和外国FIU送。起诉往外国法院送都不归它，多选全选才得分，注意B和D和E都要选。", "3046": "上次被查有短板，这次改了不少也别乐观。还可能被要求继续改，拿不出持续改进还可能吃罚。二级制裁保密无风险强制披露都错，多选全选才得分，注意C和D都要选。", "3048": "想让全员懂风险偏好，写进报告天天见，融进流程治理里，培训讲透为啥设限。光夸良性冒险光讲控制措施都没用，多选全选才得分，注意A和D和E都要选。", "3053": "一堆企业缠在一起查，先扒股东谁说了算，再问客户经理这交易为啥怪。一上来找警察直接拉黑网上私信都要不得，多选全选才得分，注意A和C都要选。", "3054": "啥人要EDD，高风险国银行来建代理，当上大使的，总理跨境开户。二十五年前的秘书本地小球员都不够格，多选全选才得分，注意C和D和E都要选。", "3055": "洗钱大了坑发展中国家两件事，没人信你家银行了，外资也不敢来了。税惠就业汇率波动都不是标准答案，多选全选才得分，注意A和D都要选。", "3057": "慈善为啥怕恐融，全球跑钱还蹭高风险区，又有信任有现金。大伙都是好人捐钱不为赚目标高尚都不是理由，多选全选才得分，注意A和D都要选。", "3058": "没制裁体系的国家咋补课，多开培训会，多搞政府间对话。断贸易加罚款都长不了记性，多选全选才得分，注意B和D都要选。", "3060": "外国银行想用美国代理户，得签字保证，谁是老板，在哪有真办公室，不让空壳蹭户。不保PEP不限只做注册国，多选全选才得分，注意A和C和E都要选。", "3062": "欧盟指令和本地法啥关系，指令搭架子，本地法落地，还能更严。本地优先完全独立必须一样都错，多选全选才得分，注意B和C都要选。", "3063": "巴塞尔说KYC咋做，按风险定不同深度的查法，把客户UBO代办人都验明。禁编号户一刀切没验完就交易都错，多选全选才得分，注意A和C都要选。", "3064": "文化物品恐融洗钱三件套，免税区存艺术品，找第三方顾问挡枪，社媒卖天价单件。公允价买请专家验真都正常，多选全选才得分，注意A和C和D都要选。", "3071": "欧盟资管反洗钱就两板斧，搜负面新闻，问清钱和资产哪来的。拒绝所有PEP请来喝茶写财务报告都不对，多选全选才得分，注意A和D都要选。"};

(function(){
  function curId(){
    try{
      if(typeof practiceList !== 'undefined' && typeof currentIndex !== 'undefined'
        && practiceList && practiceList[currentIndex]) return String(practiceList[currentIndex].id);
    }catch(e){}
    return null;
  }
  var PH='<div class="side-h">◆ 串联知识点</div><div class="side-ph">答完这题，这里会把相关考点串一串。</div>';
  function ensureSide(){
    var qc=document.querySelector('#practice .q-container'); if(!qc) return null;
    var s=document.getElementById('lianSide');
    if(!s){ s=document.createElement('div'); s.id='lianSide'; s.innerHTML=PH; qc.appendChild(s); }
    return s;
  }
  function ensureIntro(){
    var dash=document.querySelector('#home .dashboard'); if(!dash) return;
    if(document.getElementById('lianIntro')) return;
    var m=document.createElement('div'); m.id='lianIntro';
    m.innerHTML='<div class="li-t">◆ 串联知识点</div>'+
      '<div class="li-d">答完每道题，除了对错和解析，还会按题号精准弹出一条串联——哪些题是一个路子、哪儿容易混。电脑上显示在题目左侧，手机上在答案下面。<br><span style="color:#0a7d5a">学习进度自动保存在本机浏览器，换浏览器需重新开始。</span></div>';
    dash.insertBefore(m, dash.firstChild);
  }
  function wide(){ try{return window.matchMedia('(min-width:1200px)').matches;}catch(e){return false;} }
  function esc(s){ return String(s||''); }
  function fillInline(rb,t){
    var box=document.createElement('div'); box.className='lian-box';
    box.innerHTML='<div class="lian-h">◆ 串联知识点</div><div class="lian-c">'+esc(t)+'</div>';
    var ans=rb.querySelectorAll('.answer-text');
    if(ans&&ans.length){ans[0].parentNode.insertBefore(box,ans[0].nextSibling);}else{rb.insertBefore(box,rb.firstChild);}
    try{box.scrollIntoView({behavior:'smooth',block:'center'});}catch(e){}
  }
  function tick(){
    ensureIntro();
    var stemEl=document.querySelector('#practice .q-stem');
    var s=ensureSide();
    if(!stemEl) return;
    var id=curId();
    var rb=document.querySelector('.result-box:not([data-lianfull])');
    if(rb){
      rb.setAttribute('data-lianfull','1');
      var t=id && window.__LIAN_FULL__[id];
      if(s) s.setAttribute('data-qid', id||'');
      if(wide() && s){
        s.innerHTML = t ? '<div class="side-h">◆ 串联知识点</div><div class="side-c">'+esc(t)+'</div>'
                        : '<div class="side-h">◆ 串联知识点</div><div class="side-ph">这题暂无串联。</div>';
      } else if(t){ fillInline(rb,t); }
    } else if(s){
      if(id && s.getAttribute('data-qid')!==id){ s.setAttribute('data-qid',id); s.innerHTML=PH; }
    }
  }
  window.addEventListener('load',function(){
    ensureSide(); ensureIntro();
    new MutationObserver(tick).observe(document.body,{childList:true,subtree:true});
  });
})();
</script></body>
</html>
